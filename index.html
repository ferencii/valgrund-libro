us tocones, y los miraron mucho rato, que es algo que no hacen nunca con nada que dejen atrás. Luego dieron la vuelta y volaron hacia el Valhalla, y por el camino se les fue olvidando la ruta, como habían jurado. Al llegar ya no sabían por dónde habían venido.","ent":false,"cap":false},{"t":"p","h":"Lo que no olvidaron fueron los términos. Se los llevaron dentro, en un cantar que no se canta en ningún salón y que no se ha escrito en ninguna piedra, un cantar que solo oyen ellas, igual que se oye la propia sangre en los oídos cuando todo calla. No recordaban el camino ni la tierra. Recordaban que se les debía algo, y que el día de cobrarlo llegaría.","ent":false,"cap":false},{"t":"p","h":"Las plumas que viste caer en el vacío al final del corte eran suyas. Se desprendieron de los mantos cuando dieron la vuelta, y cayeron hacia la tierra que se iba sin llegar a tocarla. Algunas siguen cayendo.","ent":false,"cap":false},{"t":"p","h":"Ahora ya sabes lo que se habló en aquella pausa antes del noveno golpe. Y sabes algo que no sabe nadie más en los nueve mundos, ni siquiera el que lo juró.","ent":false,"cap":false}]},{"id":"cap-8","tipo":"capitulo","numero":8,"etiqueta":"Capítulo VIII","etiquetaLectura":"Capítulo 8","titulo":"El salón que no está en el árbol","runas":"ᛖᛚ᛫ᛊᚨᛚᛟᚾ᛫ᚲᚢᛖ᛫ᚾᛟ᛫ᛖᛊᛏᚨ᛫ᛖᚾ᛫ᛖᛚ᛫ᚨᚱᛒᛟᛚ ᛭ ᛖᛚ᛫ᛊᚨᛚᛟᚾ᛫ᚲᚢᛖ᛫ᚾᛟ᛫ᛖᛊᛏᚨ᛫ᛖᚾ᛫ᛖᛚ᛫ᚨᚱᛒᛟᛚ ᛭ ᛖᛚ᛫ᛊᚨᛚᛟᚾ᛫ᚲᚢᛖ᛫ᚾᛟ᛫ᛖᛊᛏᚨ᛫ᛖᚾ᛫ᛖᛚ᛫ᚨᚱᛒᛟᛚ ᛭ ᛖᛚ᛫ᛊᚨᛚᛟᚾ᛫ᚲᚢᛖ᛫ᚾᛟ᛫ᛖᛊᛏᚨ᛫ᛖᚾ᛫ᛖᛚ᛫ᚨᚱᛒᛟᛚ","lam":null,"bloques":[{"t":"p","h":"En el Valhalla, las valquirias sirven el hidromiel.","ent":false,"cap":true},{"t":"p","h":"Es su otro oficio, el que no sale en los cantares de batalla. Cuando han elegido a los muertos en el campo y los han llevado al salón de los caídos, se quitan el casco, cogen los cuernos y sirven. Sirven a los \u003cem>einherjar\u003c/em> que han peleado todo el día en el patio y se sientan a cenar con las heridas cerradas. Sirven a Odín, que no come y solo bebe. Sirven noche tras noche, siglo tras siglo, en un salón con tantas puertas que nadie las ha contado dos veces con el mismo resultado.","ent":false,"cap":false},{"t":"p","h":"Gondul, cuyo nombre quiere decir «la de la vara», porque en su día también supo de hechizos, era la más alta de las nueve que estuvieron en el puente, la que cerró los ojos cuando Skuld dijo el precio. Llevaba sirviendo desde antes de que hubiera reyes en Midgard. Y mientras servía, contaba.","ent":false,"cap":false},{"t":"p","h":"No contaba cuernos ni guerreros. Contaba cabezas. Porque las valquirias saben, como lo sabe la vidente a la que Odín despertó de su tumba para que se lo contara, cómo acaba todo esto. El último día, los \u003cem>einherjar\u003c/em> saldrán por todas esas puertas a la vez, de cientos en cientos, a la batalla final. El lobo se soltará y se tragará a Odín. El fuego del sur subirá hasta el cielo, y los mundos se hundirán en el mar. Después, dice la vidente, la tierra volverá a salir del agua, verde y limpia, y algunos de los dioses volverán a sentarse en la hierba a jugar con piezas de oro.","ent":false,"cap":false},{"t":"p","h":"De las valquirias no dice nada. Ni que mueran ni que vuelvan. No aparecen en el mundo nuevo. Gondul se había pasado muchas noches pensando en eso mientras llenaba cuernos.","ent":false,"cap":false},{"t":"cita","h":"\u003cp>\u003cem>Canción de las que sirven\u003c/em>\u003c/p>\n\u003cp>Servimos el sorbo\u003cspan class=\"cesura\"> \u003c/span>a los que serán segados,\u003cbr>cuernos colmados\u003cspan class=\"cesura\"> \u003c/span>para los que caerán;\u003cbr>lo vimos en la vidente:\u003cspan class=\"cesura\"> \u003c/span>vendrá el lobo,\u003cbr>y nadie nos nombra\u003cspan class=\"cesura\"> \u003c/span>en el nuevo mundo.\u003c/p>\n","estrofa":true},{"t":"p","h":"Ellas, que eligen a todos, nunca habían sido elegidas para salvarse.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"Skuld, en cambio, no servía. Pasaba el tiempo con sus hermanas, las otras nornas, junto al pozo de Urd, al pie del fresno, tejiendo lo que será.","ent":false,"cap":false},{"t":"p","h":"Había olvidado el camino a Valgrund, como juró. Lo había olvidado de verdad: si le hubieras preguntado en qué dirección estaba la tierra cortada, no habría sabido señalarla. Pero el pacto decía que olvidaran el camino que había quedado atrás, y Skuld no teje lo que fue: teje lo que será. Y en lo que será, un día, empezó a aparecer una tierra.","ent":false,"cap":false},{"t":"p","h":"Al principio era solo un nudo raro en el tejido, un sitio donde la trama se fruncía alrededor de algo que no tenía hebra. Luego, con los siglos, el frunce se fue acercando al borde de la tela, al lugar donde se teje el presente. Skuld lo miró mucho tiempo sin tocarlo. Un día pasó el dedo por encima y notó, debajo del hilo, el frío de un agua muy antigua y muy cansada.","ent":false,"cap":false},{"t":"p","h":"El pasado lo había olvidado. El porvenir, no. El porvenir no tenía motivo para olvidar nada, porque todavía no había pasado. Así fue como encontraron otra vez el camino: no recordándolo, sino viéndolo venir.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"Desde entonces, de vez en cuando, algunas de ellas iban a mirar.","ent":false,"cap":false},{"t":"p","h":"Hay un sitio en el borde del cielo donde el aire se vuelve tan fino que ya no aguanta el peso de un caballo. Las valquirias dejaban allí sus monturas y se sentaban en el saliente de nube helada, con los mantos recogidos, y miraban hacia abajo. Abajo, muy lejos, flotando en el vacío negro, pasaba Valgrund a la deriva: un disco pequeño de once anillos de islas, con los fosos brillando apenas entre ellas, como hilos de plata vieja.","ent":false,"cap":false},{"t":"p","h":"Cada vez que iban, los fosos brillaban menos. Las corrientes adelgazaban, como había dicho Skuld en el puente. Cada vez que iban, el cantar de los términos les sonaba un poco más fuerte en los oídos, como suena más fuerte la sangre cuando uno se acerca a lo que teme.","ent":false,"cap":false},{"t":"p","h":"Una vez fueron cinco. Se sentaron en el borde y estuvieron mucho rato sin hablar. La más joven, que no había estado en el puente y solo conocía los términos por el cantar, se levantó sin decir nada y sacó un pie por encima del borde, hacia el vacío, hacia la tierra que pasaba. No llegó a apoyarlo en nada. Gondul le había cogido el tobillo.","ent":false,"cap":false},{"t":"p","h":"—Si lo pisas —le dijo—, él lo ve.","ent":false,"cap":false},{"t":"p","h":"La joven recogió el pie y se volvió a sentar. Nadie dijo nada más aquella noche.","ent":false,"cap":false},{"t":"fig","id":"cap08-vigilia-en-el-borde","src":"imagenes/cap08-vigilia-en-el-borde.webp","w":1600,"h":900,"alt":"Seis valquirias con cascos alados y mantos de plumas, de pie sobre un banco de nubes, miran desde el cielo nocturno una tierra de anillos concéntricos que flota en el vacío.","pie":"","formato":"panoramica","marcador":false,"relleno":false},{"t":"sep"},{"t":"p","h":"El consejo lo celebraron en un lugar sin nombre, entre las raíces del fresno, donde ni los cuervos de Odín llegan, porque allí no hay nada que contar. Estaban todas las que oyen el cantar.","ent":false,"cap":false},{"t":"p","h":"—El agua está flaca —dijo Skuld—. No lo bastante todavía, pero se acerca. Cuando llegue el momento, mandaremos a los caídos.","ent":false,"cap":false},{"t":"p","h":"—¿A cuáles? —preguntó una.","ent":false,"cap":false},{"t":"p","h":"—A los que mueran en batalla cuando llegue el momento, como siempre. Solo que no los traeremos aquí. Los dejaremos en la orilla de allí.","ent":false,"cap":false},{"t":"p","h":"—Y nunca vendrán al Valhalla —dijo Gondul.","ent":false,"cap":false},{"t":"p","h":"—Nunca. Serán el pueblo del décimo reino. Los primeros que vivan en él después de los Gleymdir. Nuestros.","ent":false,"cap":false},{"t":"p","h":"Gondul pensó en las cabezas que contaba mientras servía, en los \u003cem>einherjar\u003c/em> saliendo por las puertas hacia el lobo. Pensó que, de todo lo que habían hecho las valquirias en su larga vida, aquello no era lo peor. A los que llevaran a Valgrund no se los comería el último día. Tendrían una tierra difícil y dura, pero suya, o casi.","ent":false,"cap":false},{"t":"p","h":"—¿Qué les diremos? —preguntó.","ent":false,"cap":false},{"t":"p","h":"Ahí estaba la dificultad, y todas la sabían. Si a un guerrero le dices «te llevamos a otro mundo para que lo limpies, y cuando esté limpio será de nosotras y tú vivirás en él para siempre, a salvo del fin del mundo», el guerrero hace dos preguntas. La primera es de quién será la casa. La segunda, qué pasa si no quiere. Y un guerrero que hace preguntas antes de luchar lucha mal.","ent":false,"cap":false},{"t":"p","h":"—Les diremos la verdad —dijo Skuld.","ent":false,"cap":false},{"t":"p","h":"Las otras la miraron.","ent":false,"cap":false},{"t":"p","h":"—Una parte —añadió—. Les diremos que hay una tierra tomada por los Once, que hay muertos antiguos que esperan, que alguien tiene que atar lo que quedó suelto y liberar a los que no pudieron ir a ninguna parte. Les diremos que vienen a limpiar. Es cierto. Vienen a eso.","ent":false,"cap":false},{"t":"p","h":"—Y les diremos que después los llevaremos a casa —dijo Gondul, despacio.","ent":false,"cap":false},{"t":"p","h":"—También es cierto —dijo Skuld—. Solo que no les diremos qué casa.","ent":false,"cap":false},{"t":"p","h":"Nadie protestó. La más joven, la del pie, miraba al suelo. Gondul se quedó con las manos en el regazo, como cuando sostiene un cuerno vacío.","ent":false,"cap":false},{"t":"p","h":"No te estoy contando que las valquirias sean malvadas. No lo son, o no más que cualquiera que ha visto su propio final y ha encontrado una puerta. Te estoy contando lo que te van a decir y lo que no, para que, cuando te lo digan, sepas escucharlo entero.","ent":false,"cap":false}]},{"id":"cap-9","tipo":"capitulo","numero":9,"etiqueta":"Capítulo IX","etiquetaLectura":"Capítulo 9","titulo":"La cárcel del olvido, I: sal, sueño, rencor y silencio","runas":"ᛚᚨ᛫ᚲᚨᚱᚲᛖᛚ᛫ᛞᛖᛚ᛫ᛟᛚᚹᛁᛞᛟ᛫ᛁ᛫ᛊᚨᛚ᛫ᛊᚢᛖᚾᛟ᛫ᚱᛖᚾᚲᛟᚱ᛫ᛁ᛫ᛊᛁᛚᛖᚾᚲᛁᛟ ᛭ ᛚᚨ᛫ᚲᚨᚱᚲᛖᛚ᛫ᛞᛖᛚ᛫ᛟᛚᚹᛁᛞᛟ᛫ᛁ᛫ᛊᚨᛚ᛫ᛊᚢᛖᚾᛟ᛫ᚱᛖᚾᚲᛟᚱ᛫ᛁ᛫ᛊᛁᛚᛖᚾᚲᛁᛟ ᛭ ᛚᚨ᛫ᚲᚨᚱᚲᛖᛚ᛫ᛞᛖᛚ᛫ᛟᛚᚹᛁᛞᛟ᛫ᛁ᛫ᛊᚨᛚ᛫ᛊᚢᛖᚾᛟ᛫ᚱᛖᚾᚲᛟᚱ᛫ᛁ᛫ᛊᛁᛚᛖᚾᚲᛁᛟ ᛭ ᛚᚨ᛫ᚲᚨᚱᚲᛖᛚ᛫ᛞᛖᛚ᛫ᛟᛚᚹᛁᛞᛟ᛫ᛁ᛫ᛊᚨᛚ᛫ᛊᚢᛖᚾᛟ᛫ᚱᛖᚾᚲᛟᚱ᛫ᛁ᛫ᛊᛁᛚᛖᚾᚲᛁᛟ","lam":{"t":"fig","id":"cap09-ola-que-no-rompe","src":"imagenes/cap09-ola-que-no-rompe.webp","w":1600,"h":900,"alt":"Una ola gigantesca y quieta, con el esqueleto de una ballena dentro, se alza al fondo de una playa de guijarros donde hay barcos viejos varados.","pie":"","formato":"apertura","marcador":false,"relleno":false},"bloques":[{"t":"p","h":"Ahora te llevaré por la cárcel tal como es hoy, después de milenios de deriva. Yo la he recorrido entera, aunque no lo parezca: un carcelero gleymdir me arrancó del tocón y me llevó colgada al cuello, y después de él me han llevado muertos, gigantes, ríos y urracas, y me han perdido y encontrado más veces de las que sé contar. Iremos de fuera hacia dentro, como irás tú si llegas lejos, y te contaré lo que hay en cada anillo: quién duerme en él, qué hace su sueño con la tierra y qué agua lo rodea.","ent":false,"cap":true},{"t":"p","h":"Antes, recuerda la ley, porque no ha cambiado:","ent":false,"cap":false},{"t":"cita","h":"\u003cp>\u003cem>La ley de la atadura\u003c/em>\u003c/p>\n\u003cp>Quiebra la carne\u003cspan class=\"cesura\"> \u003c/span>que la corriente se cose,\u003cbr>nombra el nombre\u003cspan class=\"cesura\"> \u003c/span>que nació con ella,\u003cbr>anuda el agua\u003cspan class=\"cesura\"> \u003c/span>y que el agua se aquiete.\u003c/p>\n","estrofa":true},{"t":"p","h":"Y recuerda tres cosas más.","ent":false,"cap":false},{"t":"p","h":"La primera: los presos no mueren. Se rompen, se nombran y se anudan, y entonces duermen. Pero los nudos se aflojan, como vio Odín, y con el tiempo cada preso se revuelve en su sueño y luego despierta. Atarlo una vez no es atarlo para siempre. Lo que haces en esta tierra, otro tendrá que volver a hacerlo después de ti, y quizá tú mismo.","ent":false,"cap":false},{"t":"p","h":"La segunda: cada foso es la corriente del preso de fuera, y solo se aparta para quien lleva su nudo. La primera vez que lo cruzas a bordo, con el nudo en la mano, el agua se lo bebe y te enseña el paso: tú aprendes el vado, la franja de agua mansa que la corriente abre para ti cuando llevas el timón. Sin el vado, la corriente devuelve tu barca a la orilla. Eso ya no te lo quita nadie, ni siquiera la muerte. Pero el nudo es una cosa, y las cosas se caen, se roban y se venden.","ent":false,"cap":false},{"t":"p","h":"La tercera: solo puede atar quien conoce los nombres, y los nombres solo se aprenden fuera, en los nueve mundos, en una canción de cuna. Los muertos de aquí los olvidaron hace mucho y las valquirias no pueden pisar esta tierra. Por eso hacéis falta vosotros.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"El anillo de fuera es Valfjara, «la playa de los caídos», una isla larga y curva como una hoz. Se llama así por los barcos.","ent":false,"cap":false},{"t":"p","h":"La arena es gris y está llena de barcos funerarios varados, ladeados, con las bordas comidas por la sal y los escudos todavía clavados en los costados. Algunos tienen la forma de los barcos de tu tiempo, con la proa alta y la quilla fina. Otros son tan viejos que tienen la forma de los barcos que grababan los Gleymdir en las rocas, con muchos remos y un cisne en la proa, y nadie sabe quién los trajo. Hacia fuera, más allá de la rompiente, no hay otra orilla: el mar se pierde en una niebla blanca y, detrás de la niebla, en el vacío. Hay focas en las rocas, zorros en las dunas y cangrejos en las pozas. A veces, entre las algas, se deja ver el \u003cem>marbendil\u003c/em>, «el hombre del mar», el tritón de las sagas: si consigues atraparlo, te dirá una verdad, pero solo la mitad.","ent":false,"cap":false},{"t":"p","h":"La marea sube y baja dos veces al día, y cuando sube inunda la playa y arrastra lo que hay en el suelo. Esa marea es la respiración del preso de este anillo. Se llama Brimgnyr, «el bramido de la rompiente», y su forma es la ola que viste en la batalla del vado: una ola altísima que no rompe nunca, con huesos de ballena dentro, que se alza al fondo de la playa como un acantilado de agua. Hoy está más baja que entonces. Se le ven mejor los huesos.","ent":false,"cap":false},{"t":"p","h":"Se le vence como lo venció la Tañedora. Con la marea alta no hay manera de romperle la forma. Con la marea baja, sí. Y cuando la forma se rompe, no se le nombra en el estruendo, sino en la calma que viene después: cuando una ola se retira más lejos que las otras y el mar se queda quieto, pensando, durante varias respiraciones. No hay prisa. El mar da tiempo para decir el nombre despacio y entero, como lo dijo ella. La atadura es una cuerda de fibra y algas trenzadas, y el nudo que sale de ella es de sal dura y ruge si te lo acercas al oído.","ent":false,"cap":false},{"t":"cita","h":"\u003cp>\u003cem>Estrofa de la primera celda\u003c/em>\u003c/p>\n\u003cp>Brama la rompiente,\u003cspan class=\"cesura\"> \u003c/span>la ballena en su vientre,\u003cbr>ola que no osa\u003cspan class=\"cesura\"> \u003c/span>hundirse en la orilla;\u003cbr>resuena su nombre\u003cspan class=\"cesura\"> \u003c/span>en el rugido del nudo:\u003cbr>cuando calle la costa,\u003cspan class=\"cesura\"> \u003c/span>cálmala con su nombre.\u003c/p>\n","estrofa":true},{"t":"sep"},{"t":"p","h":"El nudo de sal abre el primer foso: el estrecho que ruge, donde la corriente de la ola dormida corre en círculo alrededor del segundo anillo con un ruido que no te deja pensar. Se cruza en barca, o no se cruza.","ent":false,"cap":false},{"t":"p","h":"En la otra orilla está Lyngmor, «el páramo de brezo»: tierra abierta, viento, turberas negras, uros, lobos y víboras. Aquí la noche es peligrosa por otro motivo. Si duermes al raso, se te sientan en el pecho las maras, «las que aplastan al que duerme», delgadas como vaho, y por la mañana te levantas como si hubieras cargado piedras toda la noche. Algunos no se levantan.","ent":false,"cap":false},{"t":"p","h":"El preso de Lyngmor se llama Draumjafi, «el que da los sueños». Su forma no da miedo. Es un cuerpo enorme hundido a medias en la turbera más honda, entero, sin una herida, de piel oscura y curtida como el cuero viejo, con los ojos cerrados y la cara tranquila de quien duerme bien. No se mueve. No hace falta. Su forma de guerra no está en la turbera, sino en el sueño.","ent":false,"cap":false},{"t":"p","h":"Para romperla hay que tumbarse junto a él en la turba y dormir. Dentro del sueño se lucha y, dentro del sueño, se dice el nombre. La atadura se le echa al despertar. Pero mientras duermes, tu cuerpo se queda tumbado en la turbera, indefenso, al alcance de cualquiera que pase con un cuchillo y ganas de quedarse con tus cosas. Nadie te vela si no has pagado a alguien para que lo haga, y aun así nunca se sabe.","ent":false,"cap":false},{"t":"fig","id":"cap09-turbera-dormida","src":"imagenes/cap09-turbera-dormida.webp","w":1600,"h":900,"alt":"En un páramo de brezo al anochecer, un cuerpo hundido en una charca de turba duerme con la cara serena. Cerca, una figura flaca de pelo enmarañado se inclina sobre alguien dormido y le pone la mano en el pecho.","pie":"","formato":"vineta","marcador":false,"relleno":false},{"t":"cita","h":"\u003cp>\u003cem>Estrofa de la segunda celda\u003c/em>\u003c/p>\n\u003cp>Duerme en la turba\u003cspan class=\"cesura\"> \u003c/span>el dador de los sueños,\u003cbr>sin sangre, sin sed,\u003cspan class=\"cesura\"> \u003c/span>con los sueños sellados;\u003cbr>temible en lo tibio,\u003cspan class=\"cesura\"> \u003c/span>te tiende la mano:\u003cbr>vela tu cuerpo,\u003cspan class=\"cesura\"> \u003c/span>que vienen a verlo.\u003c/p>\n","estrofa":true},{"t":"p","h":"Su nudo es de turba y está tibio, como alguien que duerme.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"El nudo de turba abre el segundo foso: el agua que duerme, un brazo de agua negra de turba, quieta como un charco, donde quien rema sin el nudo se adormece sobre el remo y se hunde con su barca, despacio, sonriendo.","ent":false,"cap":false},{"t":"p","h":"En la otra orilla está Haugaholt, «los cerros de los túmulos». Aquí enterraron los Gleymdir a sus muertos, y aquí se quedaron los muertos del vado que las valquirias no pudieron llevarse. Es un archipiélago de cerros que salen del agua, cada uno con su túmulo redondo, y en los islotes mayores se ven las canteras de cobre de la gente de bronce, que todavía tienen las vetas verdes al aire. Entre los túmulos hay también barcos de piedra: tumbas en forma de barco, hechas con piedras hincadas en la hierba, porque los Gleymdir eran gente de barca y querían seguir navegando después de muertos. Hay bronce para quien sepa buscarlo, en el cobre de las canteras y en el ajuar de los muertos. Los muertos no lo regalan.","ent":false,"cap":false},{"t":"p","h":"De noche, los túmulos se abren. Salen los \u003cem>haugbuar\u003c/em>, «los que habitan el túmulo», cada uno con su nombre olvidado y su espada, a defender lo que es suyo. Salen también los \u003cem>afturgongur\u003c/em>, «los que vuelven», los muertos que no se resignan, a ajustar cuentas que ya nadie recuerda.","ent":false,"cap":false},{"t":"p","h":"El preso de este anillo se llama Heiftvald, «el señor del odio a muerte». Su forma es la loba de la batalla: una loba hecha de vetas rojizas y de rencores, que habla con la voz de todos los que te han matado. Se hace más fuerte con los rencores de quienes la combaten. Si has muerto hace poco a manos de otro y aún le guardas la cuenta, ella lo nota y se alimenta de eso. Para atarla, cada uno de los que la atan tiene que renunciar a una venganza. No a una cualquiera: a una que de verdad pensara cobrarse.","ent":false,"cap":false},{"t":"cita","h":"\u003cp>\u003cem>Estrofa de la tercera celda\u003c/em>\u003c/p>\n\u003cp>Loba de lutos\u003cspan class=\"cesura\"> \u003c/span>con la lengua de los tuyos,\u003cbr>habla con la voz\u003cspan class=\"cesura\"> \u003c/span>de quien te ha vencido;\u003cbr>rencor la rellena,\u003cspan class=\"cesura\"> \u003c/span>rabia la remienda:\u003cbr>suelta tu venganza\u003cspan class=\"cesura\"> \u003c/span>si quieres que se sujete.\u003c/p>\n","estrofa":true},{"t":"p","h":"Su nudo es un cordón rojo oscuro, del color de la sangre seca.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"El nudo de sangre abre el tercer foso: el cerco de túmulos, una corriente roja que corre entre arrecifes. En cada arrecife hay un túmulo y un muerto de pie, hombro con hombro con el del arrecife vecino, que no deja pasar a ningún forastero. A quien lo intenta sin el nudo, los ahogados le agarran la borda.","ent":false,"cap":false},{"t":"p","h":"En la otra orilla está Ymork, «la marca de los tejos»: una isla grande cubierta por un bosque viejo, oscuro y húmedo, donde los arroyos corren rojos porque arrastran hierro en el fondo. Ahí aprenderás a sacar hierro, si no lo sabes ya. Hay osos y linces. Hay elfos, los \u003cem>alfar\u003c/em> de la lengua antigua, que no son ni buenos ni malos y a los que conviene honrar antes de que te honren ellos a ti. Y hay \u003cem>tunridur\u003c/em>, «las que cabalgan las cercas», que vienen de noche a las casas y se sientan en los tejados.","ent":false,"cap":false},{"t":"p","h":"Y hay silencio. En Ymork el sonido no viaja: no oyes los gritos de la sala de al lado, ni los pasos de quien se te acerca, ni tu propia voz cuando gritas pidiendo ayuda. Es el sueño del preso, que se llama Thagnarvord, «el guardián del silencio». Su forma es un claro del bosque donde no se oye ni la propia sangre. Se entra en él como se entra en el agua fría: de golpe, y sin respiración.","ent":false,"cap":false},{"t":"p","h":"Allí no se puede decir el nombre, porque el silencio se traga las palabras antes de que salgan de la boca. Hay que grabarlo en runas, con un cuchillo, sobre la forma rota, letra a letra. Los Gleymdir lo descubrieron tarde y lo pagaron caro. Tú ya lo sabes.","ent":false,"cap":false},{"t":"cita","h":"\u003cp>\u003cem>Estrofa de la cuarta celda\u003c/em>\u003c/p>\n\u003cp>Calla el claro,\u003cspan class=\"cesura\"> \u003c/span>calla la sangre,\u003cbr>sereno y sin son,\u003cspan class=\"cesura\"> \u003c/span>sombra de tejo;\u003cbr>no sirve la boca\u003cspan class=\"cesura\"> \u003c/span>donde el bosque no oye:\u003cbr>graba en la grieta\u003cspan class=\"cesura\"> \u003c/span>lo que la garganta no puede.\u003c/p>\n","estrofa":true},{"t":"p","h":"Su nudo es una fibra de tejo que no hace ningún ruido, ni siquiera al romperse.","ent":false,"cap":false}]},{"id":"cap-10","tipo":"capitulo","numero":10,"etiqueta":"Capítulo X","etiquetaLectura":"Capítulo 10","titulo":"La cárcel del olvido, II: eco, podredumbre, oscuridad y escarcha","runas":"ᛚᚨ᛫ᚲᚨᚱᚲᛖᛚ᛫ᛞᛖᛚ᛫ᛟᛚᚹᛁᛞᛟ᛫ᛁᛁ᛫ᛖᚲᛟ᛫ᛈᛟᛞᚱᛖᛞᚢᛗᛒᚱᛖ᛫ᛟᛊᚲᚢᚱᛁᛞᚨᛞ᛫ᛁ᛫ᛖᛊᚲᚨᚱᚲᚺᚨ ᛭ ᛚᚨ᛫ᚲᚨᚱᚲᛖᛚ᛫ᛞᛖᛚ᛫ᛟᛚᚹᛁᛞᛟ᛫ᛁᛁ᛫ᛖᚲᛟ᛫ᛈᛟᛞᚱᛖᛞᚢᛗᛒᚱᛖ᛫ᛟᛊᚲᚢᚱᛁᛞᚨᛞ᛫ᛁ᛫ᛖᛊᚲᚨᚱᚲᚺᚨ ᛭ ᛚᚨ᛫ᚲᚨᚱᚲᛖᛚ᛫ᛞᛖᛚ᛫ᛟᛚᚹᛁᛞᛟ᛫ᛁᛁ᛫ᛖᚲᛟ᛫ᛈᛟᛞᚱᛖᛞᚢᛗᛒᚱᛖ᛫ᛟᛊᚲᚢᚱᛁᛞᚨᛞ᛫ᛁ᛫ᛖᛊᚲᚨᚱᚲᚺᚨ ᛭ ᛚᚨ᛫ᚲᚨᚱᚲᛖᛚ᛫ᛞᛖᛚ᛫ᛟᛚᚹᛁᛞᛟ᛫ᛁᛁ᛫ᛖᚲᛟ᛫ᛈᛟᛞᚱᛖᛞᚢᛗᛒᚱᛖ᛫ᛟᛊᚲᚢᚱᛁᛞᚨᛞ᛫ᛁ᛫ᛖᛊᚲᚨᚱᚲᚺᚨ","lam":{"t":"fig","id":"cap10-eco-de-las-cascadas","src":"imagenes/cap10-eco-de-las-cascadas.webp","w":1600,"h":900,"alt":"Un guerrero con antorcha, de espaldas, mira una garganta de cascadas en cuya agua se forman el busto de un hombre y una mujer con una serpiente a los pies.","pie":"","formato":"apertura","marcador":false,"relleno":false},"bloques":[{"t":"p","h":"El nudo mudo abre el cuarto foso: el agua callada, un brazo de mar quieto y cubierto de niebla, tan silencioso que nadie se orienta en él sin el nudo, porque no se oye la rompiente que te diría dónde están las rocas.","ent":false,"cap":true},{"t":"p","h":"En la otra orilla, la tierra se rompe en pedazos. Es Forsgliuf, «la garganta de las cascadas»: islas de roca partidas por cañones por donde entra el mar, con cascadas heladas a medias que caen de los acantilados al agua y caminos de cornisa colgados de las paredes. Arriba planean las águilas. Abajo saltan los salmones y juegan las nutrias. En los acantilados viven los \u003cem>bergbuar\u003c/em>, «los que habitan la roca», gigantes de piedra que no bajan de sus cornisas y no quieren que nadie suba. Aquí se hace el acero: el hierro de los tejos, templado en el agua helada de las cascadas, sale más duro que en ninguna otra parte.","ent":false,"cap":false},{"t":"p","h":"Y aquí el eco miente. Gritas tu nombre en la garganta y te vuelve otro. Preguntas por el camino y la roca te contesta con una voz que se parece a la de tu compañero, pero diciendo otra cosa. Siempre se nota que es eco, porque suena a roca mojada. Lo difícil es acordarse de ello cuando tienes miedo.","ent":false,"cap":false},{"t":"p","h":"El preso de este anillo se llama Talsmid, «el forjador de engaños». No tiene una forma, sino dos. En el polvo de agua de las cascadas se alzan dos figuras: el busto de un hombre, del pecho para arriba, y una mujer entera con una serpiente enroscada a los pies. Solo una es la verdadera. La otra es eco hecho cuerpo. Para encontrar la buena hay que fijarse en lo que dicen y en cómo lo dicen, porque la verdadera es la única cuyo contorno no tiembla. Él lo sabe, y por eso las hace hablar tanto a las dos.","ent":false,"cap":false},{"t":"p","h":"En su anillo, además, los caídos recuerdan desordenada la canción de cuna. Los once ríos se les cambian de sitio en la boca y la loba se les va al principio. Si llegas hasta aquí, repasa la canción antes de cruzar, despacio, en voz alta, mientras todavía la sabes.","ent":false,"cap":false},{"t":"cita","h":"\u003cp>\u003cem>Estrofa de la quinta celda\u003c/em>\u003c/p>\n\u003cp>Forja figuras\u003cspan class=\"cesura\"> \u003c/span>el forjador de fraudes,\u003cbr>dos cuerpos, dos caras\u003cspan class=\"cesura\"> \u003c/span>y una sola cierta;\u003cbr>recita revuelto\u003cspan class=\"cesura\"> \u003c/span>el romance de los ríos:\u003cbr>escucha el eco,\u003cspan class=\"cesura\"> \u003c/span>y que el eco no te engañe.\u003c/p>\n","estrofa":true},{"t":"p","h":"Su nudo parece otro cada vez que lo miras, pero siempre es el mismo.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"El nudo doble abre el quinto foso: los canales que mienten, pasos de agua entre farallones que cambian según quién los navegue y que llevan a las rocas a quien no tiene el nudo.","ent":false,"cap":false},{"t":"p","h":"En la otra orilla salen del mar las ramas. Te acordarás del séptimo golpe del hacha, el que vació las venas. Las ramas del fresno atravesaban Valgrund por dentro, y al cortarlas se quedaron huecas y muertas. Hoy asoman del agua como lomos de ballena, tan grandes que dentro caben salas, y son Rotgong, «los pasajes de raíz»: galerías enormes de madera petrificada, con vetas que parecen latir cuando las tocas, aunque ya no late nada. En sus paredes hay plata nativa y esteatita, la piedra blanda que sirve para hacer moldes y crisoles. Por ellas reptan serpientes que ya no tienen nombre, porque se lo quitó el olvido, y caminan \u003cem>draugar\u003c/em>, «los muertos sin descanso», carceleros gleymdir que murieron de guardia y no se han enterado.","ent":false,"cap":false},{"t":"p","h":"En Rotgong todo se pudre antes de tiempo. La madera no prende, el pan se llena de moho en una noche y el fuego cuesta tanto de encender como de mantener. Es el sueño de Funandi, «el que pudre». Su forma es una corriente lenta de madera deshecha, una papilla parda que avanza por las galerías, ablandando todo lo que toca. Cuando luchas contra él, se te pudre el equipo: el mango del hacha se ablanda, el cuero del escudo se agrieta y la espada se cubre de herrumbre. Solo aguanta lo que lleva plata. La atadura que se le echa es como la que forjó Hamar: una cadena de acero con hilos de plata embutidos.","ent":false,"cap":false},{"t":"cita","h":"\u003cp>\u003cem>Estrofa de la sexta celda\u003c/em>\u003c/p>\n\u003cp>Pudre la piedra,\u003cspan class=\"cesura\"> \u003c/span>la pica y la plancha,\u003cbr>rápida en la ruina,\u003cspan class=\"cesura\"> \u003c/span>reina de la raíz;\u003cbr>solo la plata\u003cspan class=\"cesura\"> \u003c/span>sale sana de su saliva:\u003cbr>ata con acero\u003cspan class=\"cesura\"> \u003c/span>y argénteo el amarre.\u003c/p>\n","estrofa":true},{"t":"p","h":"Su nudo es un trozo de raíz podrida que no se deshace nunca.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"El nudo de raíz abre el sexto foso: el sumidero, un agua que corre cuesta abajo, deprisa, y se mete por una boca de roca en la isla hueca que hay detrás. A quien no lleva el nudo, lo estrella contra la roca.","ent":false,"cap":false},{"t":"p","h":"Dentro de esa isla están las cuevas. Se llaman Myrkhelar, «las cuevas oscuras», y en ellas no hay luz, ni la ha habido nunca, salvo una vez. Las salas se recorren a ciegas, por el tacto de la roca, el olor del agua y el eco de las gotas. Hay peces ciegos en los lagos y, en el aire, las \u003cem>myrkridur\u003c/em>, «las que cabalgan en la oscuridad», que te rozan la nuca al pasar. En las paredes crecen el cristal de roca, claro como el agua, y los granates, rojos como brasas apagadas.","ent":false,"cap":false},{"t":"p","h":"Y en el fondo, de pie, están los enanos. Son los que se quedaron apretando nudos cuando el hacha abrió la herida y la luz entró por ella como un alba. Siguen allí, de piedra, con los martillos en la mano y las caras vueltas hacia arriba, hacia una luz que ya no está. Si pasas los dedos por sus caras en la oscuridad, encontrarás una con la boca muy apretada, como cosida por dentro. No sé si es él. Me gusta pensar que sí.","ent":false,"cap":false},{"t":"p","h":"El preso de este anillo se llama Nidamyrk, «la oscuridad cerrada». Su forma es la propia oscuridad, que se espesa hasta que pesa como el agua y se traga las antorchas una a una. No se la puede ver, así que no se la puede romper a oscuras. Hace falta una luz que dure: linternas hechas con el cristal de estas mismas cuevas, que no se apagan con su aliento. Y se la ata a la luz, nunca a oscuras.","ent":false,"cap":false},{"t":"cita","h":"\u003cp>\u003cem>Estrofa de la séptima celda\u003c/em>\u003c/p>\n\u003cp>Negra y ancha,\u003cspan class=\"cesura\"> \u003c/span>noche sin nadie,\u003cbr>se espesa en la sima\u003cspan class=\"cesura\"> \u003c/span>y se sorbe la llama;\u003cbr>lleva luz que dure\u003cspan class=\"cesura\"> \u003c/span>y que la lumbre no ceda:\u003cbr>a la luz se la ata,\u003cspan class=\"cesura\"> \u003c/span>no a la lumbre que tiembla.\u003c/p>\n","estrofa":true},{"t":"p","h":"Su nudo es negro y se bebe la luz de lo que tiene cerca.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"El nudo negro abre el séptimo foso: la boca sin luz. Por ella sale el agua de las cuevas a un mar ancho y negro, bajo una noche que no acaba, que ninguna antorcha alumbra; solo una luz de cristal.","ent":false,"cap":false},{"t":"p","h":"En la otra orilla está el hielo. Es Hrimgard, «el cerco de escarcha»: una isla grande de glaciares azules, llanuras blancas, ventiscas que esconden los caminos y un frío que mata en una noche a quien no va abrigado. Hay osos blancos, renos y morsas, cuyo marfil es lo mejor que vas a encontrar para tallar. Y hay unas piedras claras, las piedras de sol, que te dicen dónde está el sol aunque la ventisca lo tape. Los gigantes cuentan que no siempre señalan al sol. A veces señalan hacia el sitio donde estaba el árbol.","ent":false,"cap":false},{"t":"p","h":"Bajo el hielo están los salones de los gigantes que vinieron a vigilar a este preso, con las columnas rotas y las mesas puestas. Dentro del hielo están los gigantes, de escarcha y de montaña, sentados o de pie, con las armas a mano, como los dejó el frío. Tienen los ojos abiertos. Algunos todavía hablan, si te acercas lo bastante, con voces que no mueven los labios.","ent":false,"cap":false},{"t":"p","h":"Allí la encontré. Snaebjorg está en el salón más grande, junto a la puerta, con la mano en la maza y la cara vuelta hacia fuera, como quien espera visita. Fue ella quien me contó la batalla del vado, desde dentro del hielo, sin prisa, porque ya no tiene ninguna. Me dijo que no se arrepiente. Me dijo también que, si algún día pasa por allí un dios de un solo ojo, no le diga que sigue esperando.","ent":false,"cap":false},{"t":"fig","id":"cap10-gigantes-en-el-hielo","src":"imagenes/cap10-gigantes-en-el-hielo.webp","w":1600,"h":900,"alt":"Una giganta de pelo blanco, con manto de pieles y lanza, sale del hielo con los ojos abiertos junto a dos gigantes barbudos atrapados en el glaciar. A la derecha se alza un salón helado de columnas y un caminante diminuto lleva una antorcha.","pie":"","formato":"panoramica","marcador":false,"relleno":false},{"t":"p","h":"El preso de Hrimgard se llama Kaldrifjad, «el de las costillas frías», que en la lengua antigua quiere decir «el despiadado». Su forma es un cuerpo de hielo más grande que los gigantes, con el pecho de costillas transparentes y los ojos abiertos. Está despierto, pero no se mueve. No le hace falta. Lo que ataca es el frío que sale de él y que avanza por el suelo como una marea blanca.","ent":false,"cap":false},{"t":"p","h":"Se le rompe con calor. Hay que llevar fuego a través del glaciar, en una cesta de hierro, cubriéndolo con el cuerpo de la ventisca, y mantenerlo encendido mientras dura el combate. Si el fuego se apaga, se acabó, y te quedarás en el hielo con los demás, mirando la puerta.","ent":false,"cap":false},{"t":"cita","h":"\u003cp>\u003cem>Estrofa de la octava celda\u003c/em>\u003c/p>\n\u003cp>Costillas de cristal,\u003cspan class=\"cesura\"> \u003c/span>corazón de cierzo,\u003cbr>ventisca que vela\u003cspan class=\"cesura\"> \u003c/span>con los vivos ojos;\u003cbr>frío que avanza,\u003cspan class=\"cesura\"> \u003c/span>fuego que se apaga:\u003cbr>si falla la fogata,\u003cspan class=\"cesura\"> \u003c/span>fallaréis con ella.\u003c/p>\n","estrofa":true},{"t":"p","h":"Su nudo es de escarcha, y no se derrite aunque lo eches al fuego.","ent":false,"cap":false}]},{"id":"cap-11","tipo":"capitulo","numero":11,"etiqueta":"Capítulo XI","etiquetaLectura":"Capítulo 11","titulo":"La cárcel del olvido, III: brasa, hambre y un viento sin dueño","runas":"ᛚᚨ᛫ᚲᚨᚱᚲᛖᛚ᛫ᛞᛖᛚ᛫ᛟᛚᚹᛁᛞᛟ᛫ᛁᛁᛁ᛫ᛒᚱᚨᛊᚨ᛫ᚺᚨᛗᛒᚱᛖ᛫ᛁ᛫ᚢᚾ᛫ᚹᛁᛖᚾᛏᛟ᛫ᛊᛁᚾ᛫ᛞᚢᛖᚾᛟ ᛭ ᛚᚨ᛫ᚲᚨᚱᚲᛖᛚ᛫ᛞᛖᛚ᛫ᛟᛚᚹᛁᛞᛟ᛫ᛁᛁᛁ᛫ᛒᚱᚨᛊᚨ᛫ᚺᚨᛗᛒᚱᛖ᛫ᛁ᛫ᚢᚾ᛫ᚹᛁᛖᚾᛏᛟ᛫ᛊᛁᚾ᛫ᛞᚢᛖᚾᛟ ᛭ ᛚᚨ᛫ᚲᚨᚱᚲᛖᛚ᛫ᛞᛖᛚ᛫ᛟᛚᚹᛁᛞᛟ᛫ᛁᛁᛁ᛫ᛒᚱᚨᛊᚨ᛫ᚺᚨᛗᛒᚱᛖ᛫ᛁ᛫ᚢᚾ᛫ᚹᛁᛖᚾᛏᛟ᛫ᛊᛁᚾ᛫ᛞᚢᛖᚾᛟ ᛭ ᛚᚨ᛫ᚲᚨᚱᚲᛖᛚ᛫ᛞᛖᛚ᛫ᛟᛚᚹᛁᛞᛟ᛫ᛁᛁᛁ᛫ᛒᚱᚨᛊᚨ᛫ᚺᚨᛗᛒᚱᛖ᛫ᛁ᛫ᚢᚾ᛫ᚹᛁᛖᚾᛏᛟ᛫ᛊᛁᚾ᛫ᛞᚢᛖᚾᛟ","lam":{"t":"fig","id":"cap11-celdas-y-tocones","src":"imagenes/cap11-celdas-y-tocones.webp","w":1600,"h":900,"alt":"Diez pozos de piedra sellados con losas rodean una explanada, y de un pozo abierto y vacío en primer término sale viento que arrastra hojas. Detrás se alzan dos tocones gigantes y un puente roto cuyas mitades no se juntan.","pie":"","formato":"apertura","marcador":false,"relleno":false},"bloques":[{"t":"p","h":"El nudo de escarcha abre el octavo foso: el mar de ventisca, hielo a la deriva y una pared de nieve que corre en círculo sobre el agua, y que solo se deja cruzar con el nudo en el puño.","ent":false,"cap":true},{"t":"p","h":"En la otra orilla, la nieve humea. Es Hverafold, «la tierra de las fuentes hirvientes»: islas de llanos blancos agujereados por pozas que hierven, fumarolas que silban y géiseres que saltan sin avisar. El suelo quema en unos sitios y en otros se hunde. A ciertas horas, los vapores de azufre bajan por las hondonadas y matan a quien está allí. Tienen horario, como las mareas, y quien lo aprende vive. Aquí caen, más que en ninguna otra parte, las chispas de Muspelheim que Valgrund atraviesa en su deriva. Se enfrían en la nieve y dejan un metal negro y durísimo que se llama \u003cem>neistajarn\u003c/em>, «hierro de chispa».","ent":false,"cap":false},{"t":"p","h":"En este anillo viven los \u003cem>brennumenn\u003c/em>, «los incendiarios»: caídos de otros tiempos que juraron servir al preso a cambio de sus dones y que van de noche quemando casas con la gente dentro. Son caídos como tú. Recuérdalo cuando los veas.","ent":false,"cap":false},{"t":"p","h":"El preso se llama Glaedir, «el que aviva las brasas». Su forma es el relámpago de la batalla del vado, que sigue sin terminar de caer. Cuelga sobre las fuentes, crujiendo, y todo lo que hay debajo se calienta. No se le puede romper con fuego, porque es fuego, ni con hielo, porque lo hierve. Solo lo apaga el agua de otra corriente: el agua que resuena, traída desde el estrecho de la costa, nueve anillos atrás, en un odre que no se puede romper por el camino. Y tiene otra regla, más antigua: no puede nombrarlo nadie que haya roto un juramento. Si has jurado en falso, deja que lo nombre otro.","ent":false,"cap":false},{"t":"cita","h":"\u003cp>\u003cem>Estrofa de la novena celda\u003c/em>\u003c/p>\n\u003cp>Luz que no llega,\u003cspan class=\"cesura\"> \u003c/span>lanza que no cae,\u003cbr>brasa en la bruma,\u003cspan class=\"cesura\"> \u003c/span>bramido de azufre;\u003cbr>el agua que resuena\u003cspan class=\"cesura\"> \u003c/span>apaga su ardor:\u003cbr>no lo nombre el perjuro,\u003cspan class=\"cesura\"> \u003c/span>que su palabra no pesa.\u003c/p>\n","estrofa":true},{"t":"p","h":"Su nudo es una brasa que no tiene llama y no se enfría.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"El nudo de brasa abre el noveno foso: el agua que hierve, un brazo de mar que humea y burbujea bajo una cortina de vapor, y que cuece a quien entra en él sin el nudo.","ent":false,"cap":false},{"t":"p","h":"En la otra orilla no hay nada. Es Audnir, «los yermos»: una isla grande de arena negra y piedra desnuda, sin un árbol, sin agua dulce y casi sin caza. El hambre corre aquí el doble de deprisa, y la sed, más. Por el yermo vagan los \u003cem>skogarmenn\u003c/em>, «los hombres del bosque», que es como llamaban las sagas a los proscritos, aunque aquí no haya bosque: caídos flacos, de ojos grandes, que se comen a los suyos cuando no encuentran otra cosa. Les siguen carroñeros y lobos del yermo, que esperan.","ent":false,"cap":false},{"t":"p","h":"Y hay oro. Hay mucho oro, en lajas, en arroyos secos y en montones que nadie ha amontonado. El oro es el cebo del preso, que se llama Sultargest, «el huésped del hambre». Su forma es una boca que ocupa todo el horizonte. La línea del cielo se curva hacia arriba y hacia abajo, como unos labios entreabiertos, y las piedras del borde son sus dientes. Atrae a los vivos y a los muertos con el oro, y se los come con el hambre.","ent":false,"cap":false},{"t":"fig","id":"cap11-boca-del-horizonte","src":"imagenes/cap11-boca-del-horizonte.webp","w":1600,"h":900,"alt":"En un yermo de tierra agrietada, el suelo se abre en una boca enorme llena de colmillos. Delante hay un montón de monedas y anillos de oro, y un guerrero harapiento con espada lo mira.","pie":"","formato":"panoramica","marcador":false,"relleno":false},{"t":"p","h":"Se le rompe matándolo de hambre. Hay que atraerlo con comida y con oro, ponérselo delante y luego negárselo. Mientras dura el combate, nadie puede comer ni un bocado, porque lo que comes tú lo come él. Basta que uno solo de los que luchan saque el pan del zurrón para que la boca se cierre un poco más sobre todos.","ent":false,"cap":false},{"t":"cita","h":"\u003cp>\u003cem>Estrofa de la décima celda\u003c/em>\u003c/p>\n\u003cp>Boca del borde,\u003cspan class=\"cesura\"> \u003c/span>buche sin fondo,\u003cbr>traga y no tiene\u003cspan class=\"cesura\"> \u003c/span>tripa que se llene;\u003cbr>oro le ofreces\u003cspan class=\"cesura\"> \u003c/span>y hambre le otorgas:\u003cbr>niégale el pan\u003cspan class=\"cesura\"> \u003c/span>y que nadie lo nutra.\u003c/p>\n","estrofa":true},{"t":"p","h":"Su nudo es un hueso roído, sin carne y sin tuétano.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"El nudo de hueso abre el último foso, el más ancho: el agua que traga. Es un mar quieto, sin viento, donde la barca apenas avanza y el pan mengua solo en el zurrón. Quien lo cruza sin el nudo se muere de hambre a bordo antes de ver la otra orilla, aunque lleve la bodega llena.","ent":false,"cap":false},{"t":"p","h":"Al final está Hoggstad, el lugar del golpe, y entenderás por qué el centro de la cárcel es también el borde del mundo. Valgrund es como el corte de la rama que lo sostenía: tiene sus anillos, y en el medio, donde estaba el corazón de la madera, está la herida. El centro se asoma al vacío. Hoggstad es una isla de acantilados en anillo, y en su centro no hay tierra: hay una sima que da al vacío, por donde las ramas entraban en el mundo. Esa es la herida.","ent":false,"cap":false},{"t":"p","h":"Allí se alzan los Askstufar, los tocones, lisos como mesas, tan altos que tienen nubes en la cumbre. Al lado arrancan los estribos de Bruarspord, el puente roto, que suben unos pasos hacia el cielo y se acaban en el aire. De madrugada todavía se cubren de rocío, aunque ya nadie sube a lamerlo. En el suelo de roca, entre los tocones, está el pozo gris, el del olvido, quieto y opaco, y si bebes de él o te caes dentro, te olvidarás de algo que sabías hacer con las manos. Aquí no hay nada nuevo que sacar de la tierra: lo único que sirve es lo que has aprendido por el camino.","ent":false,"cap":false},{"t":"p","h":"Y alrededor del pozo están las once celdas.","ent":false,"cap":false},{"t":"p","h":"Diez son pozos sellados con losas de piedra lisa, todas iguales. Las ataduras no se ven: bajan por dentro del pozo, hacia el agua de cada anillo, y arriba solo queda la piedra. Por debajo de cada una se oye, si pegas la oreja, la respiración lenta de una corriente que duerme en su anillo, lejos.","ent":false,"cap":false},{"t":"p","h":"La undécima es la primera que encuentras al llegar, delante de las otras, y está abierta. No tiene losa ni atadura. El brocal está pulido, como si algo lo hubiera rozado mucho tiempo al pasar. Dentro no hay nada. Ni agua, ni huesos, ni sombra. Solo sale viento.","ent":false,"cap":false},{"t":"p","h":"Es el viento del borde, el que sopla siempre hacia fuera en Hoggstad y empuja a los incautos hacia el vacío. Antes salía de la herida. Hoy sale de la celda. Arrastra polvo, plumas sueltas y, a veces, un sonido.","ent":false,"cap":false},{"t":"p","h":"Los Gleymdir llamaban a su ocupante Elifti, «el undécimo», y no le dieron otro nombre. No le pusieron un nombre de miedo, como a los demás, porque no le vieron la forma o porque la vieron y no quisieron hablar de ella. No sé si estuvo alguna vez en esa celda. No sé si el undécimo nudo se cerró y se abrió después, o si no llegó a cerrarse nunca. Ya te dije que el árbol no lo sintió, o no quiso sentirlo.","ent":false,"cap":false},{"t":"p","h":"Lo que sé es lo que oigo cuando el viento pasa por el ámbar. A veces suena como una llamada. No te diré a quién llama, porque no lo sé. Solo te diré que se parece mucho a otra.","ent":false,"cap":false},{"t":"cita","h":"\u003cp>\u003cem>Estrofa de la undécima celda\u003c/em>\u003c/p>\n\u003cp>Undécima urna,\u003cspan class=\"cesura\"> \u003c/span>hueca y sin huésped,\u003cbr>\u003cem>(Este verso está en blanco.)\u003c/em>\u003cbr>ansia sin asa,\u003cspan class=\"cesura\"> \u003c/span>aire que se aleja,\u003cbr>llama con la lengua\u003cspan class=\"cesura\"> \u003c/span>de los que llaman.\u003c/p>\n","estrofa":true},{"t":"sep"},{"t":"p","h":"Te falta saber una cosa más de la cárcel, y es la más fea.","ent":false,"cap":false},{"t":"p","h":"No todos los carceleros fueron fieles. Al principio, en las generaciones que siguieron al corte, hubo Gleymdir que bajaban de noche a los nudos y los aflojaban, una vuelta, dos vueltas, a escondidas. No querían soltar a los Once, o eso decían. Querían que el río volviera a darles algo: los salmones, la cosecha, la fuerza en el brazo o la venganza que no podían cobrarse solos. Una corriente atada no da nada. Una corriente que se revuelve en su sueño, sí. Y una despierta da más que nadie.","ent":false,"cap":false},{"t":"p","h":"Así sigue siendo. Quien quiera puede acercarse a un preso despierto y ofrecerle algo. El preso aceptará, y le dará un don de verdad, y se lo cobrará de verdad, como se lo cobró el río a la Tañedora, sin decir el precio hasta el día de cobrarlo. Mientras su preso esté atado, sus dones callan. Por eso quien hace ese trato quiere que su preso despierte, y por eso desata nudos, hace ofrendas y defiende la forma cuando otros vienen a romperla. Y cada preso tiene un solo favorito a la vez, así que los que adoran a la misma corriente acaban por matarse entre ellos.","ent":false,"cap":false},{"t":"p","h":"Tendrás esa tentación. Todos la tienen. Yo no te diré qué hacer con ella, porque soy una gota y las gotas no aconsejan. Solo te diré que la Tañedora lloró la noche en que ató a su río, y que, aun así, lo ató.","ent":false,"cap":false}]},{"id":"cap-12","tipo":"capitulo","numero":12,"etiqueta":"Capítulo XII","etiquetaLectura":"Capítulo 12","titulo":"Tres inviernos sin verano","runas":"ᛏᚱᛖᛊ᛫ᛁᚾᚹᛁᛖᚱᚾᛟᛊ᛫ᛊᛁᚾ᛫ᚹᛖᚱᚨᚾᛟ ᛭ ᛏᚱᛖᛊ᛫ᛁᚾᚹᛁᛖᚱᚾᛟᛊ᛫ᛊᛁᚾ᛫ᚹᛖᚱᚨᚾᛟ ᛭ ᛏᚱᛖᛊ᛫ᛁᚾᚹᛁᛖᚱᚾᛟᛊ᛫ᛊᛁᚾ᛫ᚹᛖᚱᚨᚾᛟ ᛭ ᛏᚱᛖᛊ᛫ᛁᚾᚹᛁᛖᚱᚾᛟᛊ᛫ᛊᛁᚾ᛫ᚹᛖᚱᚨᚾᛟ","lam":{"t":"fig","id":"cap12-muerte-en-el-granero","src":"imagenes/cap12-muerte-en-el-granero.webp","w":1600,"h":900,"alt":"De noche y bajo la nieve, una guerrera de trenzas rubias yace con los ojos cerrados ante un granero de madera, con el escudo al lado y una pluma blanca junto a la mano. En el bosque brillan unos ojos amarillos.","pie":"","formato":"apertura","marcador":false,"relleno":false},"bloques":[{"t":"p","h":"Halveig, hija de Orm, se llamaba como la roca y como su padre. Halveig quiere decir «fuerza de la roca», y Orm, «serpiente». Vivía en un fiordo del norte de Midgard, donde los inviernos siempre habían sido largos y los veranos cortos. Aquel año no hubo verano.","ent":false,"cap":true},{"t":"p","h":"La nieve llegó en la época de la siega y no se fue. Cayó de lado, desde el mar y desde los montes a la vez, como si el viento no supiera de dónde soplar. El sol salía, pequeño y blanco, y no calentaba. Los corderos nacieron muertos. En la primavera siguiente, que no fue primavera, la nieve seguía allí, y el hielo no soltó las barcas. Y el tercer año, cuando ya nadie se atrevía a decir en voz alta lo que todos pensaban, la gente dejó de cumplir sus juramentos.","ent":false,"cap":false},{"t":"p","h":"Halveig vio a dos hermanos matarse por un saco de cebada. Vio a un hombre al que conocía de toda la vida quemar la casa de su vecino con el vecino dentro, para quedarse con sus vacas. Vio lobos en la aldea a pleno día, flacos como palos, que no huían de nadie. Los viejos dijeron lo que dicen los viejos, que habían conocido inviernos peores. Mentían. Ese invierno tiene nombre, aunque nadie quería decirlo: el Fimbulvetr, «el gran invierno», tres inviernos seguidos sin verano entre ellos, el que viene antes del final.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"En el borde del cielo, las valquirias también lo vieron.","ent":false,"cap":false},{"t":"p","h":"Estaban todas, las que oyen el cantar. Miraban hacia abajo, hacia los nueve mundos, y veían la nieve sobre Midgard, los hermanos con los cuchillos y los lobos en las aldeas. Sabían lo que venía después, porque la vidente lo contó y ellas lo escucharon. Luego miraron hacia el otro lado, hacia el vacío, donde pasaba una tierra pequeña de once anillos con los fosos apagados, flacos y casi grises.","ent":false,"cap":false},{"t":"p","h":"—Ha vencido —dijo Skuld.","ent":false,"cap":false},{"t":"p","h":"No dijo más. En su boca, aquellas dos palabras pesaban como su propio nombre: lo que será y lo que se debe. El plazo había vencido. Las corrientes estaban tan flacas que unos mortales podían atarlas, y el mundo se acababa lo bastante deprisa como para no esperar más.","ent":false,"cap":false},{"t":"p","h":"Gondul se ajustó el casco, que hacía siglos que no se ponía para nada que no fuera servir. Las otras hicieron lo mismo. Bajaron sobre Midgard en vuelo abierto, inclinadas, como bajan siempre a recoger lo que es suyo.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"Halveig murió defendiendo un granero.","ent":false,"cap":false},{"t":"p","h":"No era suyo. Era de la aldea, lo último que quedaba, y una noche llegaron a por él veinte hombres de otro fiordo con hachas y antorchas. Ella tenía un escudo, una lanza y cuarenta inviernos, de los cuales el último había sido muy largo. Se puso delante de la puerta. Mató a dos. El tercero le partió el escudo, y el cuarto, que era joven y tenía miedo, le metió la lanza por debajo de las costillas.","ent":false,"cap":false},{"t":"p","h":"Cayó de espaldas en la nieve. Los hombres pasaron por encima de ella, abrieron el granero y se llevaron lo que había, que no era mucho. Las huellas se fueron alejando hacia el fiordo. Ella se quedó mirando el cielo, que era blanco y bajo, con un sol pequeño como una moneda gastada.","ent":false,"cap":false},{"t":"p","h":"No vio ninguna valquiria. Nadie las ve. Notó un peso, como cuando un pájaro grande se posa en una rama sobre tu cabeza. Notó frío, más frío que el de la nieve. Y junto a su mano abierta, sobre la nieve, cayó una pluma blanca de cisne que no hacía sombra.","ent":false,"cap":false},{"t":"p","h":"Entonces oyó la voz. No venía de ninguna parte ni tenía cara. Era una voz de mujer, cansada y dulce, que le hablaba muy cerca del oído, como se le habla a una niña que tiene fiebre:","ent":false,"cap":false},{"t":"cita","h":"\u003cp>\u003cem>Lo que dicen las que eligen\u003c/em>\u003c/p>\n\u003cp>Levántate, lanza,\u003cspan class=\"cesura\"> \u003c/span>la lucha no ha acabado:\u003cbr>tierra te espera\u003cspan class=\"cesura\"> \u003c/span>tomada por los once,\u003cbr>muertos sin morada\u003cspan class=\"cesura\"> \u003c/span>que mendigan su marcha.\u003cbr>Ata a los once,\u003cspan class=\"cesura\"> \u003c/span>abre los túmulos,\u003cbr>limpia la tierra,\u003cspan class=\"cesura\"> \u003c/span>libera a los que lloran,\u003cbr>y a casa, al cabo,\u003cspan class=\"cesura\"> \u003c/span>caída, te traeremos.\u003c/p>\n","estrofa":true},{"t":"p","h":"Halveig quiso preguntar qué casa. No le quedaba aliento para preguntar nada. Cerró los ojos con la palabra \u003cem>casa\u003c/em> en la boca, y la palabra le supo a pan caliente y a fuego de turba, a la casa de su padre en el fiordo, a todo lo que ya no había.","ent":false,"cap":false},{"t":"p","h":"Tú sabes lo que la voz no dijo. Lo sabes porque estuviste conmigo en el puente. No le mintió en nada: hay una tierra tomada por los Once, hay muertos que esperan y hay una casa. Lo único que le calló fue de quién era la casa.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"Halveig no fue la primera. El primero llegó unas lunas antes, cuando el gran invierno acababa de empezar.","ent":false,"cap":false},{"t":"p","h":"Nadie vio llegar el barco. Los barcos que traen a los caídos no se ven llegar. Las que los traen no pueden pisar la orilla, así que los dejan donde acaba el vacío y empieza la marea, y la marea hace el resto. Aquella madrugada, la playa de Valfjara amaneció cubierta de rocío, un rocío grueso y brillante como el que cubría el puente cuando aún había puente, aunque llevaba milenios sin caer allí. Entre los barcos viejos, grises y medio enterrados, había uno nuevo, de madera clara, con la quilla aún mojada.","ent":false,"cap":false},{"t":"p","h":"Dentro había un hombre tumbado con el escudo sobre el pecho, como se tumba a los muertos con su ajuar. Tenía la barba escarchada y una pluma blanca junto a la mano. Al salir el sol detrás de los tocones, se movió. Se incorporó sobre un codo, y el escudo le resbaló del pecho y golpeó la tablazón.","ent":false,"cap":false},{"t":"fig","id":"cap12-primer-barco","src":"imagenes/cap12-primer-barco.webp","w":1600,"h":900,"alt":"Al amanecer, en una playa de guijarros junto a un mar en calma, un guerrero barbudo con cota de malla está sentado en un barco varado, solo, con el escudo en el regazo.","pie":"","formato":"panoramica","marcador":false,"relleno":false},{"t":"p","h":"Se llamaba Ketil, que quiere decir «caldero». Es lo único que recordaba de sí mismo: su nombre, que había muerto y que sus manos sabían hacer fuego. No recordaba de dónde venía. Se sentó en la borda mucho rato mirando el horizonte, donde los tocones se alzaban como una montaña, y después bajó a la arena y empezó a recoger ramas.","ent":false,"cap":false},{"t":"p","h":"Lo conocerás. Es el que enseña a los recién llegados a mirar, a recoger ramas y a encender su primer fuego, porque fue el primero en aprenderlo.","ent":false,"cap":false},{"t":"p","h":"Después de Ketil llegaron otros, uno cada pocas madrugadas, cada uno en su barco y cada uno con su rocío. Llegó Halveig, con la pluma en la mano y la palabra \u003cem>casa\u003c/em> todavía en la boca. Desde entonces no han dejado de llegar. Despiertan en la playa sin memoria y sin nada, salvo un cuchillo y un pedernal, y se ponen a recoger ramas porque no saben qué otra cosa hacer. Y la ola que no rompe, al fondo, los mira llegar.","ent":false,"cap":false}]},{"id":"epilogo","tipo":"epilogo","numero":null,"etiqueta":"Epílogo","etiquetaLectura":"Epílogo","titulo":"A las puertas de Valfjara","runas":"ᚨ᛫ᛚᚨᛊ᛫ᛈᚢᛖᚱᛏᚨᛊ᛫ᛞᛖ᛫ᚹᚨᛚᚠᛃᚨᚱᚨ ᛭ ᚨ᛫ᛚᚨᛊ᛫ᛈᚢᛖᚱᛏᚨᛊ᛫ᛞᛖ᛫ᚹᚨᛚᚠᛃᚨᚱᚨ ᛭ ᚨ᛫ᛚᚨᛊ᛫ᛈᚢᛖᚱᛏᚨᛊ᛫ᛞᛖ᛫ᚹᚨᛚᚠᛃᚨᚱᚨ ᛭ ᚨ᛫ᛚᚨᛊ᛫ᛈᚢᛖᚱᛏᚨᛊ᛫ᛞᛖ᛫ᚹᚨᛚᚠᛃᚨᚱᚨ","lam":{"t":"fig","id":"epilogo-despertar","src":"imagenes/epilogo-despertar.webp","w":1600,"h":900,"alt":"Desde dentro de un barco mojado de rocío se ven un escudo pintado, una mano con un hilo rojo en la muñeca y una pluma blanca. Más allá de la borda, en el horizonte, hay tocones gigantes y otro barco con una pluma gris azulada.","pie":"","formato":"apertura","marcador":false,"relleno":false},"bloques":[{"t":"p","h":"Ya casi está. Noto que el ámbar se enfría en tu mano, y eso quiere decir que te falta poco.","ent":false,"cap":true},{"t":"p","h":"No sé cómo caerás. Puede que en una batalla de verdad, con canciones, o puede que delante de un granero, en la nieve, sin que nadie se entere. Da igual. Lo que viene después es igual para todos, y te lo voy a contar para que no te asustes más de lo necesario.","ent":false,"cap":false},{"t":"p","h":"Abrirás los ojos tumbado en un barco. Lo primero que verás será el cielo, pálido y quieto, enmarcado por las bordas, con unas estrellas que no forman ninguna figura que conozcas. Tendrás el escudo sobre el pecho, como un muerto con su ajuar. Te dolerá algo que no sabrás nombrar. Y levantarás una mano delante de la cara para comprobar que todavía es tuya.","ent":false,"cap":false},{"t":"p","h":"En la muñeca llevarás un hilo rojo atado, cortado a un dedo del nudo. No podrás quitártelo. Es tu hebra, o lo que queda de ella: el telar de las nornas no llega hasta aquí, y aquí nadie tiene destino. En la borda, junto a la mano, habrá una pluma blanca de cisne que nadie ha traído. La tablazón estará mojada de rocío, y en la madera, junto a tu mano, alguien habrá grabado en runas una sola palabra: \u003cem>skuld\u003c/em>. La verás también en las piedras de la playa, muchas veces. Ya sabes lo que quiere decir. Quiere decir las dos cosas.","ent":false,"cap":false},{"t":"p","h":"Cuando te incorpores, notarás en el pecho una cicatriz fina, como de punta de lanza, que antes no tenías. Y al mirar por encima de la borda verás, al otro lado de muchas aguas, en el horizonte, una montaña que no es una montaña: los tocones. Desde la playa parecen muy lejos, y lo están.","ent":false,"cap":false},{"t":"p","h":"No recordarás casi nada. La sombra de la garza todavía cubre esta tierra y te quitará lo que sabías. Te dejará tu nombre, tu muerte y lo que saben tus manos. Lo demás irá volviendo, poco a poco, cuando toques las cosas. Y un día, recogiendo ramas o mirando el estrecho, te subirá a la boca, sin que la llames, una canción de cuna que hablaba de once ríos.","ent":false,"cap":false},{"t":"p","h":"Escúchala. Es lo único que traes que los de aquí no tienen.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"Ahora escucha esto también, aunque no sepa decirte qué significa.","ent":false,"cap":false},{"t":"p","h":"No todos los barcos de la playa llegan iguales. Casi todos traen la pluma blanca y el rocío dulce, como el tuyo. Pero alguna madrugada, en algún barco de más allá, la pluma no es de cisne. Es gris azulada, más rígida, con escarcha en las barbas aunque no haga frío, y huele a sal. Y el rocío de esa borda, si lo pruebas, sabe amargo.","ent":false,"cap":false},{"t":"p","h":"No sé quién trae esos barcos. Sé que la voz que oyen sus muertos al morir es muy parecida a la que oyó Halveig. Tan parecida que ellos no notan la diferencia. Y sé que en Hoggstad hay una celda vacía de la que sale un viento que, a veces, suena como una llamada.","ent":false,"cap":false},{"t":"p","h":"Mira las plumas. Es todo lo que puedo decirte.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"Te dirán que vienes a limpiar. Es verdad. Te dirán que hay muertos antiguos que esperan. Es verdad. Te dirán que después te llevarán a casa. También es verdad, a su manera.","ent":false,"cap":false},{"t":"p","h":"Lo que hagas con lo que te he contado es cosa tuya. Puedes atar a los Once, uno detrás de otro, de la sal al centro, y cerrar la cárcel que dejó a medias un dios que ya no se acuerda. Puedes ofrecerte a alguno de ellos, como hicieron algunos Gleymdir, y vivir de sus dones hasta el día en que te pase la cuenta. O puedes hacer lo que no ha hecho nadie todavía: cuando hayas atado lo bastante, mirar hacia el borde del cielo y preguntar en voz alta de quién será la casa.","ent":false,"cap":false},{"t":"p","h":"Recuerda solo una cosa más, la que en esta tierra sirve para todo. Lo que llevas encima muere contigo: se queda en el suelo donde caes y lo coge el primero que pasa. Lo que sabes, no. Eso no te lo quita nadie, salvo el pozo gris.","ent":false,"cap":false},{"t":"p","h":"Y recuerda lo primero que te dije, porque es lo último que te digo:","ent":false,"cap":false},{"t":"cita","h":"\u003cp>\u003cem>Estrofa de cierre\u003c/em>\u003c/p>\n\u003cp>Mira la miel\u003cspan class=\"cesura\"> \u003c/span>que en tu mano madura:\u003cbr>nueve los nombres\u003cspan class=\"cesura\"> \u003c/span>y el nuestro, ninguno.\u003cbr>Duerme, decían,\u003cspan class=\"cesura\"> \u003c/span>que duermen los once;\u003cbr>despierta, te digo,\u003cspan class=\"cesura\"> \u003c/span>que el dique se deshace.\u003cbr>Ata o desata,\u003cspan class=\"cesura\"> \u003c/span>elige tu orilla:\u003cbr>lo que se recuerda\u003cspan class=\"cesura\"> \u003c/span>vuelve a ser rama.\u003c/p>\n","estrofa":true},{"t":"p","h":"Ya está. Noto el frío. Abre los ojos.","ent":false,"cap":false},{"t":"p","h":"La marea está baja y la arena de Valfjara es gris. Hueles a sal. Te pones en pie.","ent":false,"cap":false}]}]}</script>
