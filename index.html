<script type="application/json" id="datos-libro">{"huella":"c111a4cf4d","titulo":"La saga de la rama cortada","tituloPrincipal":"La saga de la rama cortada","subtitulo":"Libro de las leyendas de Valgrund","marca":"Valgrund","runasMarca":"ᚹᚨᛚᚷᚱᚢᚾᛞ","runasTitulo":"ᛚᚨ᛫ᛊᚨᚷᚨ᛫ᛞᛖ᛫ᛚᚨ᛫ᚱᚨᛗᚨ᛫ᚲᛟᚱᛏᚨᛞᚨ","cubiertaTexto":{"titulo":"La saga de la rama cortada","subtitulo":"Libro de las leyendas de Valgrund"},"contracubierta":"Odín cortó una rama del fresno del mundo y la dejó caer en el olvido. Ahora las valquirias dejan allí a los caídos en batalla, en una orilla gris, sin nada. Esto es lo que recuerda el ámbar.","colofon":"Compuesto en EB Garamond e IM Fell English, con iniciales en Cormorant Garamond, adornos en UnifrakturMaguntia y runas en Noto Sans Runic, todas con licencia SIL Open Font License. Valgrund, edición generada el 7 de octubre de 2026.","relleno":{"alguno":false,"nota":"","historia":false,"ilustraciones":false},"pdf":"La-saga-de-la-rama-cortada.pdf","cubierta":{"t":"fig","id":"portada","src":"imagenes/portada.webp","w":1600,"h":1129,"alt":"Cubierta: el fresno del mundo sostiene nueve reinos luminosos en un cielo estrellado, y de una rama cortada que gotea ámbar se aleja un disco de anillos concéntricos que se deshace por el borde.","pie":"","formato":"lamina","marcador":false,"relleno":false},"frontispicio":[],"vinetas":[{"src":"imagenes/adorno-vineta-nudo.webp","w":480,"h":480},{"src":"imagenes/adorno-vineta-cuervo.webp","w":480,"h":480},{"src":"imagenes/adorno-vineta-drak.webp","w":480,"h":480}],"banda":{"src":"imagenes/adorno-vineta-runas.webp","w":1200,"h":131},"secciones":[{"id":"prologo","tipo":"prologo","numero":null,"etiqueta":"Prólogo","etiquetaLectura":"Prólogo","titulo":"Lo que guarda el ámbar","runas":"ᛚᛟ᛫ᚲᚢᛖ᛫ᚷᚢᚨᚱᛞᚨ᛫ᛖᛚ᛫ᚨᛗᛒᚨᚱ ᛭ ᛚᛟ᛫ᚲᚢᛖ᛫ᚷᚢᚨᚱᛞᚨ᛫ᛖᛚ᛫ᚨᛗᛒᚨᚱ ᛭ ᛚᛟ᛫ᚲᚢᛖ᛫ᚷᚢᚨᚱᛞᚨ᛫ᛖᛚ᛫ᚨᛗᛒᚨᚱ ᛭ ᛚᛟ᛫ᚲᚢᛖ᛫ᚷᚢᚨᚱᛞᚨ᛫ᛖᛚ᛫ᚨᛗᛒᚨᚱ","lam":null,"bloques":[{"t":"cita","h":"\u003cp>\u003cem>Estrofa de apertura\u003c/em>\u003c/p>\n\u003cp>Mira la miel\u003cspan class=\"cesura\"> \u003c/span>que el musgo no mancha,\u003cbr>gota guardada\u003cspan class=\"cesura\"> \u003c/span>en la grieta del golpe.\u003cbr>Nueve son los nombres\u003cspan class=\"cesura\"> \u003c/span>que nombran los niños;\u003cbr>del décimo duerme\u003cspan class=\"cesura\"> \u003c/span>la deuda sin dueño.\u003cbr>Fresno de furia,\u003cspan class=\"cesura\"> \u003c/span>la rama que falta\u003cbr>cayó con su carga\u003cspan class=\"cesura\"> \u003c/span>de cárceles y cantos.\u003cbr>Oye lo olvidado,\u003cspan class=\"cesura\"> \u003c/span>hijo de otra orilla:\u003cbr>lo que se recuerda\u003cspan class=\"cesura\"> \u003c/span>vuelve a ser rama.\u003c/p>\n","estrofa":true},{"t":"p","h":"Tienes en la mano una gota de ámbar. No pesa más que una avellana y está tibia, aunque nadie la ha calentado. Si la levantas contra la luz del amanecer, verás dentro una mota más oscura, como un insecto que se quedó dormido en la resina hace mucho tiempo. No es un insecto. Soy yo.","ent":false,"cap":true},{"t":"p","h":"Cuando aún había quien me diera nombre, me llamaban \u003cem>hunangfal\u003c/em>, que en la lengua antigua quiere decir «rocío de miel». Es el rocío que suelta el fresno que sostiene los mundos: cae de sus hojas de noche, baja por la corteza hasta los valles y las abejas lo buscan antes que a ninguna flor. Yo caí en el peor momento en que se puede caer, con el primer golpe de un hacha, y la resina de la herida me tragó antes de que tocara el suelo. Con los milenios, la resina se hizo piedra dorada. Lo que el árbol sabía en aquel instante sobre la tierra que estaba perdiendo se quedó aquí dentro, conmigo. Por eso puedo hablar.","ent":false,"cap":false},{"t":"fig","id":"prologo-gota-ambar","src":"imagenes/prologo-gota-ambar.webp","w":1600,"h":900,"alt":"Una mano sostiene una esfera de ámbar agrietada con una gota luminosa dentro, rodeada por un arco de medallones con el fresno del mundo y ocho paisajes de otros mundos.","pie":"","formato":"vineta","marcador":false,"relleno":false},{"t":"p","h":"No soy gran cosa. No sé tejer, no sé luchar y no sé mentir, que en el lugar adonde vas es casi una desgracia. Lo que sé hacer es recordar, y eso es justo lo único que allí no ha hecho nadie en mucho tiempo.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"Te lo contaré como lo cuentan los escaldos, los poetas que en los salones del norte cobran en anillos lo que pagan en versos. Ellos empiezan siempre por el árbol, así que yo también.","ent":false,"cap":false},{"t":"p","h":"El fresno se llama Yggdrasil, «el caballo del Terrible». El Terrible es uno de los muchos nombres de Odín, el señor de la furia y del saber, que se colgó nueve noches de sus ramas para aprender las runas. Los poetas, que son gente rara, llaman «caballo» a la horca. Así que el árbol que sostiene los mundos lleva el nombre de la horca de un dios, y nadie en los nueve mundos lo encuentra extraño.","ent":false,"cap":false},{"t":"p","h":"Cuenta conmigo esos mundos, por si los has olvidado. Asgard, «el cercado de los ases», donde viven los dioses. Midgard, «el cercado del medio», donde viven los hombres y donde tú, si es que eres lo que creo, has vivido hasta hace poco. Vanaheim, el mundo de los vanes, los dioses de la cosecha y del mar. Jotunheim, el mundo de los gigantes. Alfheim, el de los elfos de luz, y Svartalfheim, el de los elfos oscuros, que algunos llaman enanos. Niflheim, «el mundo de la niebla», frío como el fondo de un pozo. Muspelheim, el mundo del fuego. Y Helheim, adonde van los muertos que no murieron con la espada en la mano.","ent":false,"cap":false},{"t":"p","h":"Nueve. Los niños los cuentan con los dedos y les sobra uno. Nadie les ha explicado nunca para qué sirve ese dedo.","ent":false,"cap":false},{"t":"p","h":"Sirve para el décimo. Se llamaba Valgrund, «el suelo de los caídos», y colgaba del fresno como los otros nueve, de una rama suya, con sus ríos, sus muertos y su cielo. Hoy no figura en ningún cantar. Ningún libro lo menciona, ninguna vidente lo ha soñado y ningún dios se acuerda de él. Ni siquiera el árbol conserva la cicatriz del corte: la corteza se cerró hace tanto tiempo que ya no hay costura que buscar. Si en algún salón oyes decir que en Asgard aún se ve la herida, sonríe y sirve otra copa. Quien lo dice no sabe nada.","ent":false,"cap":false},{"t":"p","h":"Los únicos rastros de Valgrund están dentro de Valgrund. Yo soy uno de ellos. Los otros son piedras que hablan si sabes leerlas, espíritus de la tierra que hablan si sabes pagarles, gigantes atrapados en el hielo que hablan si no te comen antes y muertos que no duermen y que hablan aunque no quieras escucharlos. Lo que no vi con mis ojos de miel, me lo contaron ellos. Te avisaré cuando sea así.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"Antes de empezar debes saber una cosa, la única que de verdad importa, y la diré sin versos para que no la confundas con un adorno: \u003cstrong>en el árbol, lo que se recuerda sigue unido.\u003c/strong>","ent":false,"cap":false},{"t":"p","h":"Un mundo no cuelga del fresno solo por la madera. Cuelga también de la memoria de los otros mundos, como una barca cuelga de su amarra y de quien sabe dónde la dejó. Mientras alguien en algún salón se acuerde de una tierra, esa tierra tiene un hilo que la ata al tronco. Por eso, cuando Odín quiso perder un mundo, no le bastó con el hacha: tuvo que hacer que todos lo olvidaran. Y por eso yo, que no he olvidado, soy un peligro pequeño y dorado.","ent":false,"cap":false},{"t":"p","h":"Lo que voy a contarte es un hilo. Si lo recuerdas, algo vuelve a tenderse. No sé si eso es bueno. No soy quién para saberlo, porque soy una gota y las gotas no juzgan: caen.","ent":false,"cap":false},{"t":"p","h":"Pero vas a caer tú también, y pronto, y prefiero que llegues sabiendo algo. A los que llegan sin saber nada les cuentan una historia. Es bonita y casi verdadera, y te la contarán con tanta dulzura que te costará no creerla. Yo te contaré la otra.","ent":false,"cap":false},{"t":"p","h":"Siéntate. Acerca la gota al fuego, que el ámbar cuenta mejor cuando está tibio.","ent":false,"cap":false}]},{"id":"cap-1","tipo":"capitulo","numero":1,"etiqueta":"Capítulo I","etiquetaLectura":"Capítulo 1","titulo":"Antes del hilo","runas":"ᚨᚾᛏᛖᛊ᛫ᛞᛖᛚ᛫ᚺᛁᛚᛟ ᛭ ᚨᚾᛏᛖᛊ᛫ᛞᛖᛚ᛫ᚺᛁᛚᛟ ᛭ ᚨᚾᛏᛖᛊ᛫ᛞᛖᛚ᛫ᚺᛁᛚᛟ ᛭ ᚨᚾᛏᛖᛊ᛫ᛞᛖᛚ᛫ᚺᛁᛚᛟ","lam":null,"bloques":[{"t":"p","h":"Al principio no había arena, ni mar, ni hierba. Tampoco había dioses que pudieran echarlas de menos. Había un vacío tan grande que no tenía bordes, y los que vinieron después lo llamaron Ginnungagap, «el gran vacío abierto», porque a lo que no tiene medida hay que darle por lo menos un nombre.","ent":false,"cap":true},{"t":"p","h":"Al norte del vacío estaba la niebla, y en la niebla, una fuente. Se llamaba Hvergelmir, «el caldero que ruge», y no era una fuente como las que conoces, de las que brotan de una roca para que beban los rebaños. Era una boca abierta en lo más hondo del frío, y de ella salían once corrientes.","ent":false,"cap":false},{"t":"p","h":"Esas corrientes son los Elivagar, «las olas de tormenta». Escucha bien, porque todo lo demás depende de esto: \u003cstrong>no eran ríos.\u003c/strong> Los ríos se los inventaron después, cuando hizo falta que lo fueran. Eran las primeras cosas que se movieron en el mundo, antes de que hubiera un mundo en el que moverse. Cada una corría a su manera. Una era fría y quieta, como el agua de un lago al alba. Otra corría con un ansia que no se saciaba nunca. Otra tragaba todo lo que se le acercaba. Otra se partía en un resplandor que no llegaba a caer. Ninguna tenía orilla, porque todavía no se habían inventado las orillas.","ent":false,"cap":false},{"t":"p","h":"Bajaban rugiendo de Hvergelmir hacia el vacío, y por el camino se espesaban. Llevaban dentro algo amargo, un veneno que no era veneno para nadie, porque aún no había nadie a quien matar. Cuando ese veneno llegó al frío del abismo, se endureció. Las corrientes empezaron a dejar escarcha a su paso, capa sobre capa, como deja sal el mar en las rocas. La escarcha se amontonó en el fondo de Ginnungagap durante un tiempo que nadie contaba, porque nadie había inventado tampoco el tiempo.","ent":false,"cap":false},{"t":"fig","id":"cap01-once-corrientes","src":"imagenes/cap01-once-corrientes.webp","w":1600,"h":900,"alt":"Once corrientes onduladas, cada una de un color, salen de un remolino oscuro y cruzan la lámina hasta hundirse en un abismo negro.","pie":"","formato":"panoramica","marcador":false,"relleno":false},{"t":"sep"},{"t":"p","h":"Del sur llegaban chispas del fuego de Muspelheim. Donde la chispa tocó la escarcha, la escarcha goteó, y de aquel goteo nació el primer gigante. Se llamaba Ymir, nombre que unos entienden como «el que brama» y otros como «el gemelo», porque en él todo era doble: el hielo y el calor, la vida y lo que sobraría de ella.","ent":false,"cap":false},{"t":"p","h":"Fíjate en el orden. Primero las corrientes, luego la escarcha y luego Ymir. El primer ser vivo del mundo nació de lo que dejaron atrás los Elivagar, como nace un niño de lo que la madre no sabe que lleva dentro.","ent":false,"cap":false},{"t":"p","h":"Después vinieron los dioses. Odín y sus dos hermanos mataron a Ymir, y no fue un combate hermoso ni largo. Con su carne hicieron la tierra; con sus huesos, las montañas; con su sangre, el mar; con su cráneo, la bóveda del cielo, y con los sesos, las nubes. Así se hicieron los mundos, a golpe de cuchillo de carnicero. Los dioses quedaron satisfechos con su trabajo.","ent":false,"cap":false},{"t":"p","h":"Las corrientes lo vieron todo. No tenían ojos, pero lo vieron. Vieron cómo se descuartizaba lo que había nacido de su escarcha y cómo se repartía en salones, campos y fiordos para gente que no tenía ninguna idea de dónde venía su suelo. Si en aquella hora las corrientes sintieron algo, no lo dijeron. El agua es paciente. Recuérdalo también.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"Más tarde llegaron las nornas, las tejedoras del destino. Son tres mujeres que viven junto a un pozo al pie del fresno, y la mayor se llama Urd, «lo que fue». Cada mañana sacan agua del pozo, riegan las raíces para que el árbol no se seque y tejen. Tejen la vida de los dioses y la de los hombres, la de los gigantes y la de los enanos. Tejen cuándo nace cada uno y cuándo cae, cuánto dura un reino y cuánto un juramento. Todo lo que existe en los mundos del árbol tiene su hebra en ese telar, también Odín, que conoce la suya y sabe que acaba en las fauces de un lobo.","ent":false,"cap":false},{"t":"p","h":"Pero el telar se montó después de que todo empezara, y lo que ya existía antes no tiene hebra.","ent":false,"cap":false},{"t":"p","h":"Las nornas pasaron el hilo junto a las corrientes, una vez y otra vez, y el hilo no las tocó. No fue por descuido. No había forma de atarlas a un tejido más joven que ellas, igual que una hija no puede atar a su madre a la cuna. Por eso los Elivagar no tienen destino. No deben nada a nadie, nadie les ha fijado una hora y nadie les ha prometido un final.","ent":false,"cap":false},{"t":"p","h":"Hay un dicho que los gigantes repiten con una sonrisa que no gusta a nadie: \u003cem>lo que no está tejido no está obligado.\u003c/em> Odín lo oyó una vez y no se rio.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"A los dioses no les gustaba tener en sus mundos algo sin hebra, así que hicieron lo que hacen siempre con lo que no entienden: lo encauzaron y le pusieron nombre. Abrieron lechos de roca, levantaron orillas y empujaron las corrientes hacia ellos, igual que un labrador cava acequias para que la crecida no le arrase el campo. Las corrientes se dejaron llevar, o lo fingieron. Desde entonces corrieron como ríos, con orillas, vados y peces, y en las orillas se sentaron los hombres a lavar la ropa sin saber qué lavaban.","ent":false,"cap":false},{"t":"p","h":"Los dioses las llamaron por sus nombres, que eran suyos desde antes de que nadie los dijera, y dejaron que los hombres creyeran que eran nombres de río. Con el tiempo, los nombres bajaron a Midgard, donde las madres los cantan a los niños para dormirlos. Es una canción de cuna. La sabes. Aunque creas que no, tus labios la saben:","ent":false,"cap":false},{"t":"cita","h":"\u003cp>\u003cem>El cantar de los once ríos\u003c/em>\u003c/p>\n\u003cp>Svol y Slid,\u003cspan class=\"cesura\"> \u003c/span>la serena y la sombría,\u003cbr>Sylg que sorbe\u003cspan class=\"cesura\"> \u003c/span>los sorbos del mundo,\u003cbr>Gunnthra la de guerra,\u003cspan class=\"cesura\"> \u003c/span>Gjol la que gime,\u003cbr>Fjorm la que fuga,\u003cspan class=\"cesura\"> \u003c/span>Fimbulthul de fábulas,\u003cbr>Leiptr que luce\u003cspan class=\"cesura\"> \u003c/span>y la loba Ylg,\u003cbr>Vid la vasta\u003cspan class=\"cesura\"> \u003c/span>y Hrid la ventisca:\u003cbr>duerme, que duermen\u003cspan class=\"cesura\"> \u003c/span>los once en su dique.\u003c/p>\n","estrofa":true},{"t":"p","h":"Para que no te pierdas, te diré lo que quieren decir esos nombres, sin rodeos. Svol es «la fresca», la serena. Slid es «la temible». Sylg, «la que traga». Gunnthra, «el ansia de batalla». Gjol, «la que resuena». Fjorm, «la que se apresura». Fimbulthul, «el gran recitador». Leiptr, «el relámpago». Ylg, «la loba». Vid, «la ancha». Y Hrid, «la ventisca».","ent":false,"cap":false},{"t":"p","h":"Las madres de Midgard no saben nada de esto. Para ellas son once ríos de un país lejano, de esos que se nombran en las canciones porque suenan bien. Lo cantan con la boca medio dormida, junto al fuego, y el niño se duerme al llegar a la loba. Así es como un nombre verdadero sobrevive a todo: escondido en una nana, como un cuchillo en un cesto de lana.","ent":false,"cap":false},{"t":"p","h":"Tú la aprendiste así. Por eso te necesitan.","ent":false,"cap":false}]},{"id":"cap-2","tipo":"capitulo","numero":2,"etiqueta":"Capítulo II","etiquetaLectura":"Capítulo 2","titulo":"La rama de los once ríos","runas":"ᛚᚨ᛫ᚱᚨᛗᚨ᛫ᛞᛖ᛫ᛚᛟᛊ᛫ᛟᚾᚲᛖ᛫ᚱᛁᛟᛊ ᛭ ᛚᚨ᛫ᚱᚨᛗᚨ᛫ᛞᛖ᛫ᛚᛟᛊ᛫ᛟᚾᚲᛖ᛫ᚱᛁᛟᛊ ᛭ ᛚᚨ᛫ᚱᚨᛗᚨ᛫ᛞᛖ᛫ᛚᛟᛊ᛫ᛟᚾᚲᛖ᛫ᚱᛁᛟᛊ ᛭ ᛚᚨ᛫ᚱᚨᛗᚨ᛫ᛞᛖ᛫ᛚᛟᛊ᛫ᛟᚾᚲᛖ᛫ᚱᛁᛟᛊ","lam":{"t":"fig","id":"cap02-gleymdir-ofrenda","src":"imagenes/cap02-gleymdir-ofrenda.webp","w":1600,"h":900,"alt":"Una mujer con una trompa de bronce a la espalda lanza un hacha a un río, del que se alza una columna de agua entre peces que saltan. En el acantilado de enfrente hay grabados un barco y un sol.","pie":"","formato":"apertura","marcador":false,"relleno":false},"bloques":[{"t":"p","h":"El fresno tiene más ramas de las que nadie ha contado, pero solo diez llevaban mundo. La décima salía del tronco por el lado de poniente, más baja que las otras y más larga, y se abría como una mano que sostiene algo con cuidado. En esa mano estaba Valgrund.","ent":false,"cap":true},{"t":"p","h":"No era el más grande de los mundos ni el más rico. No tenía el oro de los dioses, ni las forjas de los enanos, ni los salones de hielo de los gigantes. Tenía agua. Cuando los dioses se cansaron de vigilar once corrientes repartidas por sus mundos, las juntaron todas en aquella rama apartada, como quien lleva la crecida a un valle donde no vive nadie importante. Allí abrieron lechos de piedra para que corrieran entrelazadas, unas por encima de otras y otras por debajo, como las hebras de una trenza que nadie ha terminado. Valgrund se volvió una tierra de vados, de estuarios y de puentes de troncos, donde nunca estabas a más de medio día de un río y nunca sabías del todo hacia dónde corría.","ent":false,"cap":false},{"t":"p","h":"Las ramas del fresno no colgaban de aquel mundo, sino que lo atravesaban. Entraban por el lado del tronco y se hundían en la tierra como venas en un brazo, y por ellas subía la savia y bajaba el rocío. Donde una rama pasaba cerca de la superficie, la hierba crecía más verde y los pozos sabían a corteza. Los niños de allí se dormían escuchando correr dentro de la tierra algo que no era agua.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"En las orillas vivía un pueblo cuyo nombre se ha perdido. Hoy los llamo como los llama la tierra, los Gleymdir, «los olvidados». Entonces no lo estaban. Tenían nombres, como tú, y los decían en voz alta.","ent":false,"cap":false},{"t":"p","h":"Eran gente de bronce. Fundían el cobre de las vetas verdes de sus colinas con el poco estaño que les llegaba, a saber por qué caminos, y con aquel metal dorado y blando hacían hachas, broches, discos de sol y trompas. Las trompas eran lo que más querían. Las llamaban \u003cem>lures\u003c/em>, en singular \u003cem>lur\u003c/em>: tubos de bronce largos como un hombre, curvados como el cuello de un cisne, que se tocaban de dos en dos, uno frente a otro, y sonaban como un buey que hubiera aprendido a cantar. En las rocas lisas grababan barcos de muchos remos, carros, hombres con hachas levantadas y círculos de sol con radios. A sus muertos los enterraban bajo túmulos redondos de tierra y piedra, con las manos cruzadas sobre la espada.","ent":false,"cap":false},{"t":"p","h":"Y daban de comer a los ríos.","ent":false,"cap":false},{"t":"p","h":"La mujer de la que te voy a hablar tocaba la trompa en las fiestas del solsticio. Su nombre no lo sé, porque la tierra lo olvidó antes de que yo naciera, así que la llamaré la Tañedora. Tenía las manos grandes, con callos en los labios de tanto soplar, una risa que se oía de una orilla a otra y un hermano pequeño que pescaba con ella.","ent":false,"cap":false},{"t":"p","h":"Aquel año los salmones no subían. Las redes salían vacías, y el invierno venía mirando por encima de las colinas. La Tañedora hizo lo que habían hecho su madre y la madre de su madre. Bajó al río al atardecer con el hacha de bronce más hermosa de la casa, una que no había cortado nunca nada porque estaba hecha para dar y no para cortar. Se subió a la laja de la orilla, se colgó la trompa del hombro y cantó lo que se canta:","ent":false,"cap":false},{"t":"cita","h":"\u003cp>\u003cem>Canto de ofrenda de los Gleymdir\u003c/em>\u003c/p>\n\u003cp>Bronce te brindo,\u003cspan class=\"cesura\"> \u003c/span>bebedor de barcas;\u003cbr>toma mi hacha,\u003cspan class=\"cesura\"> \u003c/span>trae la trucha.\u003cbr>Llena las redes,\u003cspan class=\"cesura\"> \u003c/span>lleva lo que quieras,\u003cbr>pero que pagues\u003cspan class=\"cesura\"> \u003c/span>primero, padre.\u003c/p>\n","estrofa":true},{"t":"p","h":"Soltó el hacha. El río la recibió sin ruido, como recibe una mano una moneda que ya esperaba.","ent":false,"cap":false},{"t":"p","h":"A la mañana siguiente, las redes no se podían levantar de tanto peso. Hubo salmón para ahumar, para salar y para vender río abajo, y la aldea cantó tres noches seguidas. Los Gleymdir sabían que el río da y después pide, porque siempre había sido así. Lo que no sabían, porque nadie se lo había dicho nunca, es que lo que tenían delante no era un río.","ent":false,"cap":false},{"t":"p","h":"En la luna siguiente, el hermano pequeño de la Tañedora bajó a vaciar las nasas en una mañana de calma. El agua le llegaba a la rodilla, y nunca le había llegado más arriba en aquel vado. Lo encontraron tres días después, río abajo, con los ojos abiertos y las manos llenas de truchas. La Tañedora no tocó la trompa en todo aquel invierno. Cuando volvió a tocarla, sonaba más grave.","ent":false,"cap":false},{"t":"p","h":"Así era el trato con las corrientes, y así sigue siendo para quien lo busque: dan de verdad y cobran de verdad, y nunca dicen el precio antes de cobrarlo.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"En el extremo de Valgrund donde las ramas entraban desde el tronco, un puente de piedra salía de los acantilados hacia el cielo. Los Gleymdir lo llamaban Bruarspord, «la cabeza del puente», aunque solo veían el arranque: el resto se perdía hacia arriba en una bruma clara. Por ahí bajaban, muy de tarde en tarde, los dioses, cuando querían ver cómo seguían sus ríos. Bajaban también mercaderes de otros mundos, algún enano con su fardo, algún gigante que no se fiaba de nadie y, a veces, una mujer con un manto de plumas que miraba a los guerreros como se mira el ganado antes de la feria.","ent":false,"cap":false},{"t":"p","h":"De madrugada, los sillares del puente amanecían cubiertos de un rocío espeso, en gotas grandes como avellanas, que se pegaba a los dedos y sabía dulce. Era el rocío del fresno, el mío, el que cae de las ramas a los valles. Los niños gleymdir subían descalzos a lamer las piedras antes de que el sol las secara, y los viejos decían que quien lo probaba recordaba sus sueños.","ent":false,"cap":false},{"t":"fig","id":"cap02-puente-dioses","src":"imagenes/cap02-puente-dioses.webp","w":1600,"h":900,"alt":"Un puente de piedra con arcos sube hacia el cielo bajo las ramas de un árbol inmenso que gotea rocío dorado. Junto al río, tres seres de musgo y madera con cornamenta de ramas lo vigilan.","pie":"","formato":"vineta","marcador":false,"relleno":false},{"t":"p","h":"Al pie del puente vivían los \u003cem>landvetir\u003c/em>, «los espíritus de la tierra», que guardan cada rincón de un mundo como un perro guarda una casa. No se dejaban ver bien. Unas veces eran una zorra que te miraba demasiado rato; otras, una piedra con algo parecido a unos ojos, o un niño que no era de ninguna familia. Se les dejaba leche en las piedras huecas, y a cambio no dejaban que el puente se soltara. Les gustaba la gente de bronce, que les cantaba, y no les gustaban las corrientes, a las que no se puede ladrar.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"La noche en que los ríos corrieron hacia arriba, la Tañedora estaba despierta, porque desde la muerte de su hermano dormía poco.","ent":false,"cap":false},{"t":"p","h":"Salió a orinar detrás de la casa y oyó un ruido que no conocía. No era el murmullo del vado ni el golpe del salmón contra la corriente, sino un sorbo largo, como el de alguien que bebe de un cuenco sin respirar. Bajó a la orilla con un tizón en la mano y vio que el río estaba subiendo por su propio lecho, hacia la fuente y no hacia el mar. Las piedras del fondo quedaban al aire y se veían las raíces de los juncos. Los peces se agitaban en el barro. Río arriba, el agua se amontonaba como se amontona el trigo en la era, cada vez más alta, cada vez más quieta.","ent":false,"cap":false},{"t":"p","h":"Miró a las colinas y vio que todos los ríos de Valgrund hacían lo mismo. Brillaban a la luna como once cuchillos vueltos hacia atrás.","ent":false,"cap":false},{"t":"p","h":"A la mañana siguiente los ríos volvían a correr hacia abajo, como si nada. En las orillas, los ancianos dijeron que había sido un sueño, y en las forjas, que había sido la luna. Nadie se acordó de dar de comer a los ríos aquella semana. La Tañedora no se lo contó a nadie, porque no había nadie que la fuera a creer. Pero aquella mañana descolgó la trompa de la pared, la limpió con arena y la dejó junto a la puerta, como se deja el hacha cuando se oyen pasos de noche.","ent":false,"cap":false}]},{"id":"cap-3","tipo":"capitulo","numero":3,"etiqueta":"Capítulo III","etiquetaLectura":"Capítulo 3","titulo":"Cuando los ríos se alzaron","runas":"ᚲᚢᚨᚾᛞᛟ᛫ᛚᛟᛊ᛫ᚱᛁᛟᛊ᛫ᛊᛖ᛫ᚨᛚᛉᚨᚱᛟᚾ ᛭ ᚲᚢᚨᚾᛞᛟ᛫ᛚᛟᛊ᛫ᚱᛁᛟᛊ᛫ᛊᛖ᛫ᚨᛚᛉᚨᚱᛟᚾ ᛭ ᚲᚢᚨᚾᛞᛟ᛫ᛚᛟᛊ᛫ᚱᛁᛟᛊ᛫ᛊᛖ᛫ᚨᛚᛉᚨᚱᛟᚾ ᛭ ᚲᚢᚨᚾᛞᛟ᛫ᛚᛟᛊ᛫ᚱᛁᛟᛊ᛫ᛊᛖ᛫ᚨᛚᛉᚨᚱᛟᚾ","lam":{"t":"fig","id":"cap03-lanza-agua","src":"imagenes/cap03-lanza-agua.webp","w":1600,"h":900,"alt":"Odín, con parche en el ojo, acaba de lanzar su lanza contra dos gigantes de agua con barba de espuma que se alzan del mar. Detrás de él, una hueste toca trompas de bronce junto a una giganta y unos gigantes translúcidos.","pie":"","formato":"apertura","marcador":false,"relleno":false},"bloques":[{"t":"p","h":"Snaebjorg, cuyo nombre quiere decir «amparo de nieve», era una giganta de la montaña. Tenía la piel gris y agrietada como la roca vieja, y la paciencia de las piedras que han visto pasar muchos inviernos. Había bajado a Valgrund por el puente a cambiar sal de roca por bronce, y estaba acampada en una loma sobre el valle grande, donde se juntaban cuatro ríos. Ella fue la primera que lo vio, y a ella se lo oí contar mucho después, desde dentro del hielo, con una voz que ya no movía los labios.","ent":false,"cap":true},{"t":"p","h":"Primero, el silencio. Los cuatro ríos dejaron de sonar al mismo tiempo, como cuando una sala entera se calla porque alguien ha desenvainado. Luego, el agua se puso en pie.","ent":false,"cap":false},{"t":"p","h":"No hay otra forma de decirlo. Los ríos se levantaron de sus lechos como se levanta un hombre que ha estado mucho tiempo tumbado, despacio al principio y luego de golpe. Cada corriente se alzó con una forma hecha de sí misma, lo que los antiguos llamaban su \u003cem>hamur\u003c/em>, «la forma, la piel»: la piel de guerra que se ponen las cosas que no tienen cuerpo cuando quieren que se las vea.","ent":false,"cap":false},{"t":"p","h":"En el estuario se alzó una ola que no rompía. Subió y subió, y se quedó suspendida sobre la costa, alta como un acantilado, con costillas de ballena flotando dentro como huesos en una jalea. En las colinas de los túmulos se alzó una loba hecha de vetas rojizas, que aullaba con muchas voces a la vez. En el bosque se alzó una oscuridad más negra que la noche, que no proyectaba sombra porque ella misma lo era. Sobre las fuentes calientes se alzó un relámpago que se quedó a medio caer, quieto en el aire, crujiendo. Y en el horizonte del este, la línea del cielo se curvó como unos labios que se entreabren.","ent":false,"cap":false},{"t":"p","h":"Snaebjorg contó las formas, porque los gigantes cuentan todo lo que temen. Contó diez. Donde debería haber estado la undécima, en un recodo del valle, solo había hierba aplastada en círculo y un viento que soplaba hacia fuera desde un punto en el que no había nada. Los túmulos de los Gleymdir dicen que la primera en alzarse fue la loba; los gigantes, que fue la ola. Yo no lo vi, porque aún no había caído del árbol. Lo único que sé, porque el árbol lo notó en todas sus hojas, es que antes de que se levantara la primera hubo un viento.","ent":false,"cap":false},{"t":"p","h":"Querían lo suyo. Eso fue lo que entendió Snaebjorg, que entiende de rencores antiguos. Habían visto descuartizar a Ymir, hecho de su escarcha. Habían visto cómo los mundos se cortaban de su carne y cómo los dioses las encerraban en acequias. Habían esperado más que nadie. Y ahora, en la rama apartada donde los dioses las habían juntado para no tener que vigilarlas, habían descubierto que juntas pesaban más que el árbol.","ent":false,"cap":false},{"t":"p","h":"La ola avanzó hacia los poblados de la costa. Los Gleymdir subieron a las lomas con sus niños a cuestas y las trompas al hombro, y desde allí tocaron todas a la vez, de dos en dos, durante toda la noche, hasta que el sonido subió por el puente y alguien, arriba, lo oyó.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"Odín bajó por Bruarspord al tercer día.","ent":false,"cap":false},{"t":"p","h":"Venía como viene a los campos de batalla: con un solo ojo, porque el otro lo dejó hace mucho en prenda a cambio de un trago de saber; con un manto azul oscuro y un sombrero de ala ancha calado hasta la ceja, y con su lanza. Sobre los hombros llevaba sus dos cuervos, Huginn, «el pensamiento», y Muninn, «la memoria», que cada mañana vuelan sobre los mundos y cada noche le cuentan al oído lo que han visto. Detrás venían los \u003cem>einherjar\u003c/em>, «los que luchan solos», los mejores guerreros caídos de Midgard, a los que sus doncellas habían elegido en mil campos y que vivían con él en el Valhalla, «el salón de los caídos». Allí pelean cada día por gusto y cada noche se curan las heridas para pelear al día siguiente. Llevaban siglos esperando una guerra de verdad. Bajaron cantando.","ent":false,"cap":false},{"t":"p","h":"Los gigantes vinieron también, y aquello no se había visto nunca ni se volvió a ver. Los \u003cem>jotnar\u003c/em>, que es como se llama en la lengua antigua a los gigantes, son enemigos de los dioses desde el principio, y lo serán hasta el final. Pero también ellos son hijos de la escarcha de Ymir, y ningún hijo quiere que la madre vuelva para tragárselo. Bajaron gigantes de la montaña con mazas de piedra y gigantes de escarcha con lanzas de hielo azul, y Snaebjorg se puso al frente de los suyos porque ya estaba allí. Odín la miró de arriba abajo, con el único ojo, y ella le devolvió la mirada con los dos.","ent":false,"cap":false},{"t":"p","h":"—No es por ti —le dijo.","ent":false,"cap":false},{"t":"p","h":"—Nunca lo es —contestó Odín.","ent":false,"cap":false},{"t":"p","h":"Los Gleymdir se pusieron a un lado, con sus hachas de bronce y sus escudos de cuero, sin saber muy bien a quién temer más. La Tañedora estaba entre ellos, con la trompa.","ent":false,"cap":false},{"t":"p","h":"Odín subió a la loma de Snaebjorg y miró el valle. Los cuervos se le levantaron de los hombros y se quedaron dando vueltas sobre la loma, sin un graznido, cosa que no hacen nunca. Abajo, las diez formas esperaban de pie sobre sus cauces vacíos: la ola, la loba, la oscuridad, el relámpago, la boca del horizonte y las otras, menos claras, más lejos. Y en el recodo, el círculo de hierba aplastada, con su viento sin nadie. Odín lo miró más rato que a las otras. Luego bajó.","ent":false,"cap":false},{"t":"fig","id":"cap03-rios-en-pie","src":"imagenes/cap03-rios-en-pie.webp","w":1600,"h":900,"alt":"Desde una loma, Odín, de espaldas y con lanza, mira una llanura donde se alzan diez columnas de agua, fuego, humo, hielo y viento, con un hueco en medio por el que solo gira el viento. A la derecha, un grupo de personas toca trompas de bronce y levanta antorchas.","pie":"","formato":"panoramica","marcador":false,"relleno":false},{"t":"p","h":"La hueste se reunió en el vado grande, donde la ola tenía que pasar para llegar a las colinas. Fue la batalla más extraña de las que se han librado entre los mundos, y no hay ningún cantar de los nueve mundos que la recuerde. Solo esta tierra la recuerda:","ent":false,"cap":false},{"t":"cita","h":"\u003cp>\u003cem>Cantar de la batalla del vado\u003c/em>\u003c/p>\n\u003cp>Se alzaron los ríos\u003cspan class=\"cesura\"> \u003c/span>de raíz y de rabia,\u003cbr>los vados volvieron\u003cspan class=\"cesura\"> \u003c/span>de vena a veneno.\u003cbr>Vino el Tuerto\u003cspan class=\"cesura\"> \u003c/span>con tropa y con trompas,\u003cbr>gigantes de grava\u003cspan class=\"cesura\"> \u003c/span>y gente de bronce.\u003cbr>Lanzó la lanza,\u003cspan class=\"cesura\"> \u003c/span>la lluvia la lame:\u003cbr>no tiñe la punta\u003cspan class=\"cesura\"> \u003c/span>lo que el tejido no toca.\u003cbr>Cayó el caudillo\u003cspan class=\"cesura\"> \u003c/span>en la corriente crecida,\u003cbr>y la hija del monte\u003cspan class=\"cesura\"> \u003c/span>lo alzó en hombros.\u003c/p>\n","estrofa":true},{"t":"sep"},{"t":"p","h":"Odín abrió la batalla como abrió la primera guerra de los mundos: arrojando su lanza por encima de la hueste enemiga. Así la consagraba. Todo lo que muriera bajo aquella lanza sería suyo, y lo que es suyo no puede vencerle.","ent":false,"cap":false},{"t":"p","h":"La lanza voló en un arco alto y limpio y atravesó la pared de la ola.","ent":false,"cap":false},{"t":"p","h":"No la hirió. El agua se abrió en un agujero redondo, por el que se vio por un instante el cielo del otro lado, y se cerró detrás como se cierra una cortina. Cayeron unas gotas. No hubo sangre, ni grito, ni consagración. La lanza siguió volando, se clavó en una colina lejana y se quedó vibrando como una cuerda pulsada.","ent":false,"cap":false},{"t":"p","h":"Los \u003cem>einherjar\u003c/em> dejaron de cantar.","ent":false,"cap":false},{"t":"p","h":"Odín tardó en entenderlo, aunque entiende las cosas antes que nadie. Su lanza consagra lo que está en el tejido de las nornas, porque todo lo que tiene hebra puede ser ofrecido, y lo que se ofrece pertenece. Pero las corrientes no tenían hebra. No se las podía ofrecer a nadie, ni siquiera a él. No eran de nadie, y nunca lo habían sido.","ent":false,"cap":false},{"t":"p","h":"La ola bajó sobre el vado.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"Los \u003cem>einherjar\u003c/em> pelearon como pelean los que no pueden morir del todo: sin miedo y sin sentido. Se lanzaban contra el agua con las espadas en alto, el agua se los tragaba y los escupía en la orilla, rotos, y volvían a levantarse. La loba entró por el flanco de los gigantes y no mordía carne: mordía rencores. Los gigantes empezaron a pegarse entre ellos por viejas cuentas que no recordaban tener. La oscuridad se tragó a una fila de Gleymdir con sus antorchas, y no se volvió a ver ninguna.","ent":false,"cap":false},{"t":"p","h":"Odín se metió en el vado con el agua por la cintura, para alcanzar su lanza o para alcanzar algo. La corriente le cogió las piernas.","ent":false,"cap":false},{"t":"p","h":"Lo arrastró como arrastra el río un tronco. Le quitó el sombrero y lo hundió. Lo golpeó contra las piedras del fondo y le llenó la boca y el ojo de agua amarga, más vieja que el primer gigante. Y Odín, que se colgó nueve noches del árbol sin quejarse, notó algo que no había notado nunca: que se iba.","ent":false,"cap":false},{"t":"p","h":"Las nornas le tejieron una muerte hace mucho tiempo, y él la conoce. Morirá el último día, el día del Ragnarok, «el destino de los poderes», cuando los dioses caigan y el lobo abra las fauces. Esa hebra, que tanto le pesa, es también su escudo. Mientras su hora no llegue, nada que esté tejido puede matarle antes, porque el tejido no se contradice. Por eso puede meterse en cualquier batalla de los nueve mundos sabiendo que saldrá de ella.","ent":false,"cap":false},{"t":"p","h":"Pero lo que le arrastraba no estaba tejido. Para las corrientes, la hora de Odín no significaba nada. Podían ahogarle allí mismo, una mañana cualquiera, en un vado de un mundo apartado, muchos siglos antes de que llegara el lobo. Y si Odín moría antes de su hora, el tejido entero se rompería por esa hebra, porque todas las demás están cosidas a la suya.","ent":false,"cap":false},{"t":"p","h":"Una mano grande y gris se cerró sobre su manto.","ent":false,"cap":false},{"t":"p","h":"Snaebjorg lo sacó del agua como se saca a un cordero de una zanja: por el pescuezo, sin ceremonia. Se lo echó al hombro, subió la orilla con el agua chorreándole por las grietas de la piel y lo dejó caer en la hierba. Odín tosió agua durante mucho rato. Cuando pudo hablar, no le dio las gracias.","ent":false,"cap":false},{"t":"p","h":"—Aquí puedo morir —dijo—. Antes de mi día.","ent":false,"cap":false},{"t":"p","h":"—Entonces no mueras aquí —dijo la giganta, y volvió al vado.","ent":false,"cap":false},{"t":"p","h":"Odín se quedó tumbado mirando el cielo con su único ojo, mientras en el valle sus guerreros caían y se levantaban y volvían a caer. Pensó lo que piensa siempre: qué se puede ganar y a qué precio. Cuando se levantó, ya no buscaba su lanza.","ent":false,"cap":false},{"t":"p","h":"Lo que no se puede matar, pensó, tal vez se pueda encerrar.","ent":false,"cap":false}]},{"id":"cap-4","tipo":"capitulo","numero":4,"etiqueta":"Capítulo IV","etiquetaLectura":"Capítulo 4","titulo":"Once nudos, once celdas","runas":"ᛟᚾᚲᛖ᛫ᚾᚢᛞᛟᛊ᛫ᛟᚾᚲᛖ᛫ᚲᛖᛚᛞᚨᛊ ᛭ ᛟᚾᚲᛖ᛫ᚾᚢᛞᛟᛊ᛫ᛟᚾᚲᛖ᛫ᚲᛖᛚᛞᚨᛊ ᛭ ᛟᚾᚲᛖ᛫ᚾᚢᛞᛟᛊ᛫ᛟᚾᚲᛖ᛫ᚲᛖᛚᛞᚨᛊ ᛭ ᛟᚾᚲᛖ᛫ᚾᚢᛞᛟᛊ᛫ᛟᚾᚲᛖ᛫ᚲᛖᛚᛞᚨᛊ","lam":null,"bloques":[{"t":"p","h":"Encendieron el fuego en lo alto de la loma, donde la loba no llegaba, y se sentaron alrededor cuatro que no se habrían sentado juntos por ningún otro motivo.","ent":false,"cap":true},{"t":"p","h":"Odín, todavía con el manto húmedo. Snaebjorg, que no cabía bien junto al fuego y se sentó un poco atrás, de modo que su cara quedaba en la sombra y sus rodillas en la luz. La Tañedora, porque los Gleymdir la mandaron como habían mandado siempre a quien hablaba por ellos con los ríos. Y Hamar, un enano herrero que había bajado de Svartalfheim con su gente cuando oyó que en Valgrund hacía falta metal. Su nombre quiere decir «martillo», y también «roca», porque para un enano es lo mismo. En aquel entonces todavía hablaba.","ent":false,"cap":false},{"t":"p","h":"—Lo que no está vivo no se mata —dijo Odín—. Lo que no está tejido no se consagra. Pero todo lo que tiene nombre se puede atar.","ent":false,"cap":false},{"t":"p","h":"—Tienen nombres de río —dijo la Tañedora—. Los cantan nuestras madres.","ent":false,"cap":false},{"t":"p","h":"—No son nombres de río. —Odín removió las brasas con un palo—. Son los suyos, los verdaderos, los que tenían antes de que hubiera nadie para decirlos. Nosotros solo dejamos que los hombres creyeran otra cosa. Saberlos no es lo difícil, porque los sabe cualquier niño. Lo difícil es saber cuál es de cuál, porque cuando se ponen la piel de guerra ninguna dice cómo se llama. Yo lo sé.","ent":false,"cap":false},{"t":"p","h":"Hamar escupió en el fuego, que es como dicen los enanos que algo les interesa.","ent":false,"cap":false},{"t":"p","h":"—Atar el agua —dijo—. Nadie ha atado nunca el agua.","ent":false,"cap":false},{"t":"p","h":"—Nadie lo ha intentado en el orden correcto —dijo Odín.","ent":false,"cap":false},{"t":"p","h":"Y les dijo el orden. Primero, romper la forma: la piel de guerra que cada corriente se pone para luchar, la ola, la loba o la oscuridad, porque mientras la lleva puesta la corriente está entera y no oye. Segundo, decir el nombre verdadero en el momento en que la forma se deshace, cuando la corriente está desnuda y escucha. Tercero, anudar: rodear lo nombrado con una atadura hecha para esa corriente y no para otra, y apretar. Lo nombrado y anudado no muere, pero se duerme y se condensa en un nudo que cabe en la mano.","ent":false,"cap":false},{"t":"p","h":"Los Gleymdir lo aprendieron en forma de verso, porque así se aprende lo que no se debe olvidar. Todavía se lee en las piedras:","ent":false,"cap":false},{"t":"cita","h":"\u003cp>\u003cem>La ley de la atadura\u003c/em>\u003c/p>\n\u003cp>Quiebra la carne\u003cspan class=\"cesura\"> \u003c/span>que la corriente se cose,\u003cbr>nombra el nombre\u003cspan class=\"cesura\"> \u003c/span>que nació con ella,\u003cbr>anuda el agua\u003cspan class=\"cesura\"> \u003c/span>y que el agua se aquiete.\u003c/p>\n","estrofa":true},{"t":"sep"},{"t":"p","h":"Las ataduras las hizo Hamar. Se llaman \u003cem>fjotrar\u003c/em>, que no quiere decir otra cosa que «ataduras», porque los enanos no gastan palabras en lo que sirve.","ent":false,"cap":false},{"t":"p","h":"Montó la forja en una cueva sobre el valle y trabajó sin dormir mientras afuera la batalla seguía a ratos. Escuchaba lo que le contaban los que bajaban del frente: cómo era cada forma, qué la hería, qué la hacía retroceder. Para cada corriente hizo una atadura distinta, porque cada agua se escapa por un sitio diferente. Para la ola, una cuerda de algas y fibra de duna trenzadas, que el mar no pudre porque las reconoce como suyas. Para la loba, un cordón teñido con algo que nunca quiso decir. Para la que pudre lo que toca, una cadena de acero con hilos de plata embutidos, porque la plata es lo único que la podredumbre no muerde. Para la oscuridad, una trenza tan fina y clara que parecía cristal hilado. Así hasta once.","ent":false,"cap":false},{"t":"p","h":"Cuando terminó la primera, la de algas, la colgó de una viga y se quedó mirándola un rato largo, con las manos llenas de sal.","ent":false,"cap":false},{"t":"p","h":"—Esto no aguantará siempre —dijo.","ent":false,"cap":false},{"t":"p","h":"—Nada aguanta siempre —dijo la Tañedora, que le traía el agua.","ent":false,"cap":false},{"t":"p","h":"—Las cosas que yo hago, sí —dijo Hamar. Y siguió trabajando.","ent":false,"cap":false},{"t":"fig","id":"cap04-forja-ataduras","src":"imagenes/cap04-forja-ataduras.webp","w":1600,"h":900,"alt":"Un enano de barba trenzada martillea una cadena sobre el yunque en una forja de roca, mientras de las paredes cuelgan cuerdas, correas, cadenas y trenzas de fibra.","pie":"","formato":"vineta","marcador":false,"relleno":false},{"t":"p","h":"Al final colgaban once de la viga. Diez se veían bien a la luz de la fragua. La undécima quedaba al fondo, donde la luz no llegaba, y Hamar nunca dijo de qué la había hecho.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"La primera atadura la hizo la Tañedora, y la hizo con la ola.","ent":false,"cap":false},{"t":"p","h":"Odín le dijo el nombre al oído, una sola vez, en la loma, y ella lo guardó en la boca como se guarda una brasa. Esperaron a la marea baja. Cuando el mar se retiró, la ola que no rompía quedó más baja y más flaca, con los huesos de ballena asomando como los palos de un barco hundido. Los \u003cem>einherjar\u003c/em> y los gigantes la atacaron entonces con todo lo que tenían: mazas, hachas, lanzas, piedras arrancadas del acantilado. La ola se rajó por fin, como se raja el hielo de un lago en primavera, y se derramó por la playa en un torrente sucio de espuma y de costillas.","ent":false,"cap":false},{"t":"p","h":"Pero no se dice el nombre cuando la forma cae. Se dice cuando calla.","ent":false,"cap":false},{"t":"p","h":"La Tañedora esperó en la arena mojada, con la trompa a la espalda y la cuerda de algas en las manos. La corriente rota se recogía y volvía a empujar, ola tras ola, bramando, y en cada bramido no se oía nada más. Luego una ola se retiró más lejos que las otras, y el mar se quedó quieto. No fue un instante. Fue una calma larga, de las que hay entre dos olas grandes en los días de marea baja: el agua se aleja, se queda pensando y tarda en volver. El bramido calló. Se oyó una gaviota. Se oyó respirar a la gente de la loma: una vez, dos, tres, cuatro.","ent":false,"cap":false},{"t":"p","h":"En aquel silencio, la Tañedora dijo el nombre. No lo gritó. Lo dijo despacio, como se dice el nombre de alguien a quien se quiere despertar sin asustarle, y tuvo tiempo de sobra para decirlo bien.","ent":false,"cap":false},{"t":"p","h":"El mar la escuchó. Lo que quedaba de la ola se encogió sobre sí mismo como un animal que se acurruca, y ella le echó la cuerda alrededor y apretó. Cuando abrió las manos, tenía en ellas un nudo de sal dura, del tamaño de un puño, y si se lo acercaba al oído oía rugir el mar.","ent":false,"cap":false},{"t":"p","h":"Lloró, porque aquel era el río al que había cantado toda su vida, el que le había dado los salmones y le había quitado a su hermano. Luego se secó la cara y fue a buscar la segunda atadura.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"Las diez siguientes costaron más, y alguna costó mucho. No te contaré ahora cómo se rompió cada forma ni cómo se nombró cada corriente: lo verás tú mismo, si llegas tan lejos, porque cada una se ató a su manera y cada manera se puede repetir. Solo te diré cómo era la cárcel que construyeron alrededor de ellas, porque eso sí lo vi, desde arriba, en la memoria del árbol.","ent":false,"cap":false},{"t":"p","h":"Odín no quería una cárcel con muros. Los muros se saltan. Quería una cárcel hecha de las propias presas. Mandó a los gigantes y a los enanos partir Valgrund en anillos, uno dentro de otro, como los anillos que deja el año en el tronco de un árbol, y entre anillo y anillo, como la línea oscura que separa un año de otro, dejó sitio para el agua. Once anillos, de la costa hacia el centro. En el anillo de fuera puso a la corriente más débil y en el centro, a la más temible. Las otras quedaron en medio, ordenadas de menos a más, como se ordenan los perros de una jauría según lo que muerden.","ent":false,"cap":false},{"t":"p","h":"Y luego hizo lo que solo podía ocurrírsele a él. Alrededor de cada anillo hizo correr la corriente ya atada del anillo anterior, convertida en foso. La ola dormida de la costa se volvió un estrecho que ruge y que rodea el segundo anillo. La segunda corriente, atada, rodeó el tercero. Y así hasta el centro. Donde pasaba el agua, la tierra se rompía. Lo que había sido un solo país de vados y de puentes de troncos se quedó en islas: unas grandes como reinos pequeños, otras sembradas como piedras en un vado, y todas en círculo. Desde entonces, en Valgrund no se va de un anillo a otro andando.","ent":false,"cap":false},{"t":"p","h":"Un foso así no deja pasar ninguna barca, salvo la de quien lleva el nudo de su corriente. El agua no se ahoga a sí misma: reconoce su nudo y se aparta, como un perro se aparta ante su dueño. Quien ató a la presa de un anillo puede bajar al siguiente, y quien no la ató, no. Era una cárcel pensada para carceleros, en la que solo puede avanzar el que ya ha cerrado una puerta.","ent":false,"cap":false},{"t":"p","h":"Los Gleymdir juraron guardarla. Se repartieron por los anillos, cada familia junto a su agua dormida, y prometieron vigilar los nudos para que nadie los soltara, ellos tampoco. Muchos lo cumplieron hasta la muerte. Otros, no. De eso hablaremos.","ent":false,"cap":false},{"t":"p","h":"En el centro, en el lugar donde las ramas del fresno entraban en Valgrund, los enanos labraron en la roca viva once celdas, abiertas en círculo como bocas de pozo. Allí se anclaba cada nudo, como se amarra una barca a su poste: cada presa dormía en su anillo, pero su atadura bajaba hasta el centro y se cerraba en su celda. La Tañedora grabó el plano de todo en una losa, con un cincel de bronce, para que los carceleros que vinieran después supieran dónde estaba cada cosa. Sobre cada celda grabó la marca de un nudo cerrado.","ent":false,"cap":false},{"t":"p","h":"Grabó diez. Sobre la undécima, el cincel le tembló, o se le acabó la luz, o no sé qué. El trazo de aquella celda quedó más tenue que los otros, y no tiene marca.","ent":false,"cap":false},{"t":"fig","id":"cap04-once-celdas","src":"imagenes/cap04-once-celdas.webp","w":1600,"h":900,"alt":"Plano visto desde arriba de una tierra en anillos concéntricos de playa, brezo, bosque, cuevas, hielo y agua, con once chozas de piedra en círculo y tres tocones en el centro.","pie":"","formato":"panoramica","marcador":false,"relleno":false},{"t":"p","h":"El árbol sintió cerrarse diez nudos, uno tras otro, como se siente que se cierra una herida: un tirón y luego alivio. El undécimo no lo sintió. O lo sintió y no quiso saberlo. Los árboles, como las personas, a veces prefieren no saber.","ent":false,"cap":false},{"t":"p","h":"Odín no celebró nada. Se pasó la última noche sentado junto a los nudos del centro, mirándolos. Hacia el alba vio lo que temía. El nudo de sal estaba húmedo, sudaba un agua que no venía de ninguna parte, y si se lo acercaba al oído el rugido sonaba más cerca que la víspera. Los nudos se aflojaban, no ese día ni ese año, pero se aflojaban.","ent":false,"cap":false},{"t":"p","h":"Entendió por qué. Más allá del puente, en los nueve mundos, todos se acordaban de las corrientes. Las madres seguían cantando la canción de cuna, los dioses sabían dónde estaban los ríos y los gigantes contaban la batalla en sus salones. Cada recuerdo era un hilo que salía de los nudos y subía por el puente hacia el árbol. Y por un hilo, por fino que sea, el agua acaba encontrando el camino.","ent":false,"cap":false},{"t":"p","h":"La cárcel funcionaba. Lo que no funcionaba era el mundo de fuera.","ent":false,"cap":false}]},{"id":"cap-5","tipo":"capitulo","numero":5,"etiqueta":"Capítulo V","etiquetaLectura":"Capítulo 5","titulo":"El hacha sin nombre","runas":"ᛖᛚ᛫ᚺᚨᚲᚺᚨ᛫ᛊᛁᚾ᛫ᚾᛟᛗᛒᚱᛖ ᛭ ᛖᛚ᛫ᚺᚨᚲᚺᚨ᛫ᛊᛁᚾ᛫ᚾᛟᛗᛒᚱᛖ ᛭ ᛖᛚ᛫ᚺᚨᚲᚺᚨ᛫ᛊᛁᚾ᛫ᚾᛟᛗᛒᚱᛖ ᛭ ᛖᛚ᛫ᚺᚨᚲᚺᚨ᛫ᛊᛁᚾ᛫ᚾᛟᛗᛒᚱᛖ","lam":{"t":"fig","id":"cap05-hacha-muerde-rama","src":"imagenes/cap05-hacha-muerde-rama.webp","w":1600,"h":900,"alt":"Odín, con parche en el ojo y agazapado sobre una rama gigantesca, clava un hacha de doble filo en la madera, de la que mana resina dorada que gotea. Debajo, en el vacío, se ve una tierra de anillos concéntricos.","pie":"","formato":"apertura","marcador":false,"relleno":false},"bloques":[{"t":"p","h":"Odín volvió a la forja de Hamar al día siguiente, con el nudo de sal en la mano. Lo dejó sobre el yunque. El nudo sudaba.","ent":false,"cap":true},{"t":"p","h":"—Aguanta —dijo el enano.","ent":false,"cap":false},{"t":"p","h":"—Hoy —dijo Odín—. Mañana también. Dentro de mil años, menos. Dentro de diez mil, nada. Tiran de él desde fuera. Cada vez que alguien en los nueve mundos se acuerda de esta tierra, la cuerda se afloja un poco.","ent":false,"cap":false},{"t":"p","h":"—Pues que no se acuerden.","ent":false,"cap":false},{"t":"p","h":"Odín lo miró con el único ojo y el enano se dio cuenta de lo que había dicho. Se quedaron un rato callados, cada uno con su pensamiento, que era el mismo.","ent":false,"cap":false},{"t":"p","h":"No bastaba con olvidar los ríos. Si se olvidaba a las presas pero no la tierra, alguien acabaría preguntando qué había en la tierra. Si se olvidaba la tierra pero seguía unida al árbol, la savia la seguiría recordando por dentro, como recuerda el cuerpo un brazo que ya no siente. Había que hacer las dos cosas: separar Valgrund del fresno y separarlo de la memoria. Cortar la madera y cortar el recuerdo, de un mismo golpe y para siempre.","ent":false,"cap":false},{"t":"p","h":"—Necesito un hacha —dijo Odín.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"Hamar la forjó en tres días y no pronunció ni una palabra en todo ese tiempo.","ent":false,"cap":false},{"t":"p","h":"No fue por solemnidad. Los enanos dan nombre a todo lo que forjan, y lo hacen mientras forjan, en voz baja, golpe a golpe, porque creen que el metal se templa mejor si sabe cómo se llama. Las espadas famosas de los nueve mundos tienen nombres que se dijeron sobre el yunque antes de que existiera la hoja. Pero lo que tiene nombre se recuerda, y lo que se recuerda tira del árbol. Aquella hacha no podía tener nombre. Hamar se cosió la boca por dentro, como se cose un saco, para no decírselo por costumbre.","ent":false,"cap":false},{"t":"p","h":"Le salió una hoja ancha, gris y lisa, sin ninguna marca: ni runas, ni el sello del herrero, ni un solo adorno donde se pudiera posar un recuerdo. El mango era de un fresno joven, sin cortar de ningún bosque conocido. Cuando Hamar la sacó del agua de temple, el vapor no hizo ruido.","ent":false,"cap":false},{"t":"p","h":"Se la entregó a Odín con las dos manos. Odín la sopesó y asintió. Hamar abrió la boca para decir algo y no le salió nada. Lo intentó otra vez. No volvió a hablar nunca más, ni aquel día ni en los milenios que siguieron, y por eso la tierra lo llama Hamar el Callado. No sé si fue el precio del hacha o si, después de tres días, se le olvidó cómo se hacía. Los enanos dicen que da lo mismo.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"El lugar donde las ramas entraban en Valgrund estaba al pie del puente, en el centro de los anillos, que era también el borde del mundo, porque por allí se asomaba la tierra al árbol. Los Gleymdir lo llamaban de una manera que hoy suena a profecía: Hoggstad, «el lugar del golpe». En su lengua, la misma palabra quería decir también «el punto débil», el sitio por donde se puede herir a alguien. Allí se juntaban las once celdas, el arranque del puente y las ramas, que entraban en la tierra gruesas como torres, con la corteza llena de surcos.","ent":false,"cap":false},{"t":"p","h":"Odín mandó subir por el puente a todos los \u003cem>einherjar\u003c/em> que aún se tenían en pie. Les dijo que volvieran al Valhalla, que la batalla había terminado. No les dijo lo que iba a pasar, y ellos subieron cantando otra vez, con menos ganas. Los que la corriente había deshecho, los que ya no podían levantarse, se quedaron tendidos en el vado junto a los Gleymdir muertos y a los gigantes caídos. Los vivos de Valgrund se quedaron en Valgrund: la gente de bronce, los gigantes que habían peleado al lado de Odín y los enanos de la forja. Nadie se lo pidió. Nadie se lo preguntó tampoco.","ent":false,"cap":false},{"t":"p","h":"Odín subió solo por el puente, sin más compañía que sus dos cuervos, hasta el tramo en que las ramas corrían junto a la baranda, del lado del árbol. Allí los espantó con la mano, y los cuervos se fueron volando hacia la copa, lejos, porque lo que iba a hacer no debían verlo ni contarlo. Se quitó el manto, pasó por encima de la baranda y bajó a la rama mayor. Se agazapó sobre ella como un leñador sobre un tronco caído, con los pies bien plantados en la corteza, escupió en las manos y levantó el hacha.","ent":false,"cap":false},{"t":"p","h":"El primer golpe lo dio en la rama mayor.","ent":false,"cap":false},{"t":"cita","h":"\u003cp>\u003cem>Cantar del hacha\u003c/em>\u003c/p>\n\u003cp>Primero, la piel:\u003cspan class=\"cesura\"> \u003c/span>se partió la corteza.\u003c/p>\n","estrofa":false},{"t":"p","h":"El hacha mordió la rama. La madera gritó como grita un animal grande cuando la lanza le entra, un sonido que bajó por el tronco del fresno hasta las raíces y subió hasta la copa, y en los nueve mundos los perros levantaron la cabeza sin saber por qué. De la herida salieron astillas largas como lanzas y una resina espesa, dorada, que olía a miel y a sangre. Y de una hoja muy alta, sacudida por el golpe, se soltó una gota de rocío.","ent":false,"cap":false},{"t":"p","h":"Era yo. Caí despacio, como caen las cosas pequeñas, y vi pasar por delante la corteza herida, el hacha, el ojo de Odín, que no me miró, y abajo, muy abajo, la tierra de los once anillos, que todavía no sabía que se iba. La resina me recogió antes de que tocara nada. Se cerró sobre mí, tibia y espesa. Ahí empecé yo.","ent":false,"cap":false},{"t":"cita","h":"\u003cp>Segundo, la savia:\u003cspan class=\"cesura\"> \u003c/span>sangró sin sonido.\u003c/p>\n","estrofa":false},{"t":"p","h":"El segundo golpe cortó la savia. La rama dejó de latir por dentro, y en Valgrund los pozos que sabían a corteza empezaron a saber a piedra.","ent":false,"cap":false},{"t":"cita","h":"\u003cp>Tercero, el tejido:\u003cspan class=\"cesura\"> \u003c/span>tembló la trama.\u003c/p>\n","estrofa":false},{"t":"p","h":"El tercero lo sintieron las nornas. No dejaron de tejer, porque nunca dejan, pero el hilo se les fue de los dedos un instante, y aquel día nació en Midgard un niño con un destino torcido.","ent":false,"cap":false},{"t":"cita","h":"\u003cp>Cuarto, el canto:\u003cspan class=\"cesura\"> \u003c/span>calló la copa.\u003c/p>\n","estrofa":false},{"t":"p","h":"Con el cuarto, los pájaros del fresno dejaron de cantar en la rama del décimo mundo y se fueron volando a las otras.","ent":false,"cap":false},{"t":"cita","h":"\u003cp>Quinto, el querer:\u003cspan class=\"cesura\"> \u003c/span>quedó sin quien lo quisiera.\u003c/p>\n","estrofa":false},{"t":"p","h":"El quinto, me contaron después los \u003cem>landvetir\u003c/em>, lo notaron ellos. Fue como si alguien que les quería hubiera salido de casa sin despedirse.","ent":false,"cap":false},{"t":"cita","h":"\u003cp>Sexto, el sendero:\u003cspan class=\"cesura\"> \u003c/span>se secaron las sendas.\u003c/p>\n","estrofa":false},{"t":"p","h":"El sexto cortó los caminos. Los senderos que subían de Valgrund al árbol, y que solo pisaban los dioses y los muertos, se borraron como se borra la huella en la arena mojada.","ent":false,"cap":false},{"t":"cita","h":"\u003cp>Séptimo, la vena:\u003cspan class=\"cesura\"> \u003c/span>la veta se vació.\u003c/p>\n","estrofa":false},{"t":"p","h":"El séptimo vació las ramas que atravesaban la tierra. Por dentro de Valgrund, la madera viva se volvió hueca y gris, y lo que había sido vena se quedó en galería.","ent":false,"cap":false},{"t":"cita","h":"\u003cp>Octavo, el oído:\u003cspan class=\"cesura\"> \u003c/span>ya nadie lo oye.\u003c/p>\n","estrofa":false},{"t":"p","h":"El octavo cortó el oído. A partir de entonces, lo que se gritara en Valgrund ya no se oiría en ningún otro mundo.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"Antes del noveno golpe, Odín se detuvo.","ent":false,"cap":false},{"t":"p","h":"Bajó el hacha y se quedó quieto sobre la rama el tiempo que dura una conversación, mirando un punto del aire, delante de él, a la altura del filo. Yo, desde la resina, tenía el sol de frente y solo vi un resplandor blanco. Pero oí. Movió los labios. Una vez asintió. Luego volvió a escupirse en las manos.","ent":false,"cap":false},{"t":"p","h":"Hubo una conversación, sí. Te la contaré cuando sepas lo bastante. Ahora solo necesitas saber que la hubo, y que lo que se dijo en ella sigue pesando sobre la tierra adonde vas.","ent":false,"cap":false},{"t":"cita","h":"\u003cp>Noveno, el nexo:\u003cspan class=\"cesura\"> \u003c/span>nadie lo nombre.\u003c/p>\n","estrofa":false},{"t":"p","h":"El noveno golpe atravesó la última rama y el puente con ella, porque el puente descansaba sobre la rama como un brazo sobre el hombro de un amigo. Los sillares se partieron por la mitad con un ruido seco, y el tramo de abajo se fue inclinando hacia Valgrund mientras el de arriba se quedaba firme del lado del árbol.","ent":false,"cap":false},{"t":"p","h":"Y Valgrund empezó a alejarse.","ent":false,"cap":false},{"t":"p","h":"No cayó, como caería una piedra. Se fue, como se va una barca que alguien ha desamarrado de noche: despacio al principio, ladeándose un poco, y luego cada vez más lejos, con una franja de vacío negro que se ensanchaba entre la tierra y el puente. Las estrellas entraron por esa franja como entra el agua por una grieta.","ent":false,"cap":false},{"t":"fig","id":"cap05-puente-roto","src":"imagenes/cap05-puente-roto.webp","w":1600,"h":900,"alt":"Un puente de piedra partido por la mitad sobre un abismo de nubes: a un lado, dos tocones enormes; al otro, dos figuras de espaldas sobre un saliente de roca, una alta de pelo blanco y otra con un báculo.","pie":"","formato":"panoramica","marcador":false,"relleno":false},{"t":"p","h":"En el borde de la tierra que se iba estaban Snaebjorg y la Tañedora. La giganta, enorme, y la mujer de bronce a su lado, que no le llegaba a la cadera. No hicieron ningún gesto. No gritaron ni levantaron la mano. Miraban el puente y a la figura con el hacha, cada vez más pequeña, como se mira a alguien que ya se sabía que se iba a ir. Detrás de ellas, de las ramas cortadas solo quedaban tocones: muñones colosales de fresno, lisos como mesas por donde había pasado el hacha. Hoy los llamamos los Askstufar, «los tocones del fresno», y en los días claros se ven desde la playa, en el horizonte, como una montaña.","ent":false,"cap":false},{"t":"p","h":"Odín dejó caer el hacha sin nombre al vacío. No la tiró, la dejó caer, y nadie sabe dónde fue a parar. Luego volvió a pasar la baranda, recogió su manto y subió por el puente hacia el árbol, sin volverse.","ent":false,"cap":false},{"t":"p","h":"Yo me quedé dentro de la resina, pegada al tocón, en la tierra que se iba. Desde allí vi algo que él no vio. Sobre el vacío, entre las dos mitades del puente, caían plumas blancas.","ent":false,"cap":false}]},{"id":"cap-6","tipo":"capitulo","numero":6,"etiqueta":"Capítulo VI","etiquetaLectura":"Capítulo 6","titulo":"La garza extiende las alas","runas":"ᛚᚨ᛫ᚷᚨᚱᛉᚨ᛫ᛖᚲᛊᛏᛁᛖᚾᛞᛖ᛫ᛚᚨᛊ᛫ᚨᛚᚨᛊ ᛭ ᛚᚨ᛫ᚷᚨᚱᛉᚨ᛫ᛖᚲᛊᛏᛁᛖᚾᛞᛖ᛫ᛚᚨᛊ᛫ᚨᛚᚨᛊ ᛭ ᛚᚨ᛫ᚷᚨᚱᛉᚨ᛫ᛖᚲᛊᛏᛁᛖᚾᛞᛖ᛫ᛚᚨᛊ᛫ᚨᛚᚨᛊ ᛭ ᛚᚨ᛫ᚷᚨᚱᛉᚨ᛫ᛖᚲᛊᛏᛁᛖᚾᛞᛖ᛫ᛚᚨᛊ᛫ᚨᛚᚨᛊ","lam":{"t":"fig","id":"cap06-garza-olvido","src":"imagenes/cap06-garza-olvido.webp","w":1600,"h":900,"alt":"Una garza gris gigante extiende las alas sobre el fresno del mundo, en cuyas ramas hay nueve aldeas y salones, mientras caen plumas sobre ellos. Al pie del árbol, el agua cae en un pozo de piedra.","pie":"","formato":"apertura","marcador":false,"relleno":false},"bloques":[{"t":"p","h":"Hay un pájaro del que los escaldos hablan poco, y siempre en voz baja. Se llama \u003cem>ominnishegri\u003c/em>, «la garza del olvido». Planea sobre los que beben demasiado y les roba el juicio, de modo que a la mañana siguiente no recuerdan lo que dijeron ni a quién se lo prometieron. Odín la conoce bien. Una vez, en casa de Gunnlod, la giganta que guardaba el hidromiel de la poesía, bebió tanto que la garza le ató con sus plumas y no recordó cómo había salido de allí. Desde entonces aconseja beber con medida. Él no siempre lo hace.","ent":false,"cap":true},{"t":"p","h":"El olvido de Valgrund no podía ser como el de una borrachera, que se cura con agua y vergüenza. Tenía que ser total. Si quedaba en algún rincón de los nueve mundos una sola persona que se acordara, la cárcel tendría un hilo por el que deshacerse. Así que, cuando Odín llegó a lo alto del puente, la garza ya le estaba esperando, y no se posó en un solo bebedor.","ent":false,"cap":false},{"t":"p","h":"Extendió las alas sobre los nueve mundos.","ent":false,"cap":false},{"t":"p","h":"Eran tan grandes que su sombra cubrió Asgard y Midgard a la vez, los salones de los gigantes y las forjas de los enanos, los bosques de los elfos y las nieblas del norte. De sus plumas, grises y deshilachadas como la lana vieja, se desprendió un plumón que bajó despacio, igual que baja la primera nieve. Cayó en los salones de escudos y en los caseríos de pescadores, en las mesas de los reyes y en las cunas. A cada uno que le tocaba una pluma, se le olvidaba algo. Bajaba un poco la cabeza, como quien entra en una sala y no recuerda a qué venía, y luego seguía con lo suyo.","ent":false,"cap":false},{"t":"p","h":"Se olvidó el décimo mundo. Se olvidó la batalla del vado. Se olvidó que los ríos de la canción habían sido algo más que ríos. Los gigantes olvidaron que habían luchado junto a un dios, y les sentó bien, porque no les gustaba recordarlo. Los \u003cem>einherjar\u003c/em> que habían subido cantando por el puente se sentaron en el Valhalla y no supieron decir de dónde tenían aquellas heridas nuevas.","ent":false,"cap":false},{"t":"p","h":"Solo una cosa se le escapó a la garza, y fue por lo pequeña que era. En una casa de Midgard, una mujer cantaba a su hijo para que se durmiera. Le cayó una pluma en el pelo y se le olvidó todo lo que había sabido de Valgrund, que tampoco era mucho. La canción no se le olvidó. Siguió cantando, porque la canción no hablaba de ninguna tierra, solo de once ríos con nombres bonitos. Y la garza, que roba recuerdos y no melodías, pasó de largo.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"Lo que se olvida no desaparece. Eso no lo saben los que olvidan. Se va a alguna parte, como el agua de la lluvia, que no se pierde aunque deje de verse.","ent":false,"cap":false},{"t":"p","h":"Cada raíz del fresno tiene su pozo. Al pie de una está el de Urd, donde tejen las nornas. Al pie de otra está el de Mímir, «el que recuerda», el guardián del saber, en cuyo fondo descansa el ojo que Odín dio a cambio de un trago. Valgrund también tenía el suyo, en el centro, entre las once celdas. Hasta entonces era un pozo pequeño, de agua clara, del que los Gleymdir sacaban agua para las ofrendas. Aquella noche se llenó.","ent":false,"cap":false},{"t":"p","h":"Todo lo que los nueve mundos olvidaron de Valgrund bajó a él. Bajó por el aire, por el vacío y por los restos del puente, como bajan las aguas turbias tras una tormenta: los recuerdos de los gigantes, los de los dioses, los de los \u003cem>einherjar\u003c/em>, los de la madre que cantaba. Se volvió agua gris, opaca, que no refleja nada. Desde entonces se llama Gleymskubrunn, «el pozo del olvido», y es el reverso del pozo de Mímir: allí se va a buscar memoria a cambio de un ojo, y aquí la memoria se pierde aunque no la des. Quien bebe de esa agua o cae en ella se olvida de cosas que sabía hacer con las manos.","ent":false,"cap":false},{"t":"p","h":"Por eso los rastros de Valgrund solo están dentro de Valgrund. Todo lo que se olvidó vino a parar aquí.","ent":false,"cap":false},{"t":"p","h":"Lo último que bajó fue el recuerdo de Odín.","ent":false,"cap":false},{"t":"p","h":"No lo vi caer, pero lo vi llegar. Bajó por el vacío como una hoja seca, dando vueltas, más oscuro que los demás y más pesado, y se hundió en el pozo sin salpicar. Arriba, en lo alto del puente, el dios se dejó cubrir por la garza como ya se había dejado cubrir una vez en casa de Gunnlod, solo que esta vez a sabiendas. Cerró el único ojo. Cuando lo abrió, estaba en un puente que no llevaba a ninguna parte, con las manos manchadas de resina, y no supo por qué. Huginn se le posó en el hombro. Muninn tardó en volver, y cuando volvió no traía nada que contar. Odín, que siempre ha temido más por la memoria que por el pensamiento, se quedó mirándolo un momento. Luego se encogió de hombros, porque no es de los que se quedan mirando lo que no entienden, y volvió a Asgard. Por el camino se le secó la resina, y se la quitó de las manos sin pensar en ella.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"En el fresno, donde habían estado las ramas del décimo mundo, había una herida abierta, astillada y llena de resina. La vi desde lejos, mientras Valgrund se alejaba, y la vi cerrarse.","ent":false,"cap":false},{"t":"p","h":"Fue rápido, como todo lo que hace un árbol cuando nadie le mira. La corteza de los bordes se hinchó y empezó a avanzar desde los lados, gris y nueva, igual que avanza la piel sobre una quemadura. Se juntó en el centro y se alisó. La savia buscó otros caminos. Donde había estado la herida quedó una corteza igual que la de alrededor, sin marca, sin costura y sin ese labio levantado que dejan las cicatrices. Al poco, ni un leñador lo habría notado. El árbol había olvidado que allí había tenido una rama.","ent":false,"cap":false},{"t":"p","h":"No te diré cómo está hoy el árbol, porque no lo sé, y quien te diga que lo sabe miente. Lo que te puedo decir es que, en aquella hora, el fresno se curó del todo, y que lo hizo tan bien que ya no quedaba nada de lo que acordarse.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"Después vino la deriva.","ent":false,"cap":false},{"t":"p","h":"Valgrund se alejó del árbol por el vacío, sin rama y sin rumbo. Durante los primeros años aún se veía el fresno a lo lejos, una mancha verde enorme en el cielo. Luego fue una mancha pequeña; luego, una estrella entre otras, y luego, nada.","ent":false,"cap":false},{"t":"p","h":"El cielo de Valgrund cambió. En los nueve mundos, al sol y a la luna los persiguen dos lobos, Skol, «la burla», y Hati, «el que odia», y por eso el sol corre y los días pasan deprisa. A Valgrund no lo siguió ningún lobo. El sol se volvió perezoso y los días se alargaron, quietos, como tardes de verano que no se acaban. Las estrellas dejaron de formar las figuras que conocen los marineros. Y a veces, en su viaje, Valgrund atravesaba nubes de chispas sueltas del fuego de Muspelheim, las mismas con las que los dioses hicieron las estrellas. Caían sobre la tierra como granizo encendido y se apagaban humeando en la nieve.","ent":false,"cap":false},{"t":"p","h":"Los que se quedaron fueron muriendo, cada uno a su manera.","ent":false,"cap":false},{"t":"p","h":"Los Gleymdir vivieron algunas generaciones junto a sus aguas dormidas, vigilando los nudos, como habían jurado. Pero en una tierra sin camino no llega estaño y, sin estaño, no hay bronce nuevo. Fundieron lo viejo, y luego lo más viejo, y luego ya no había nada que fundir. Sus barcas se pudrieron en las playas, y nadie hizo otras. Sus nietos olvidaron para qué servían las trompas. Sus bisnietos olvidaron sus propios nombres, porque no había nadie fuera que se los recordara. Murieron, y los enterraron bajo túmulos que nadie iba a visitar. Los últimos se enterraron solos.","ent":false,"cap":false},{"t":"p","h":"Los gigantes se fueron al anillo del frío, a vigilar la corriente que más temían, la que no dormía del todo. Montaron sus salones en el hielo y se sentaron a esperar. El frío que salía de aquella presa avanzaba un palmo cada invierno. Los alcanzó sentados. Allí siguen, dentro del hielo, con los ojos abiertos.","ent":false,"cap":false},{"t":"p","h":"A los enanos los atrapó la luz. Cuando el hacha cortó las ramas, por la herida entró una claridad blanca, dura, que bajó por las galerías huecas hasta las cuevas del fondo. Era como el alba, y el alba convierte en piedra a los enanos que no se han puesto a cubierto. Muchos estaban abajo, en los túneles, apretando nudos. Quedaron de pie, con las herramientas en la mano, grises como las paredes.","ent":false,"cap":false},{"t":"p","h":"Y las corrientes, dormidas, atadas y sin nadie en los nueve mundos que las recordara, empezaron a adelgazar. No de un año para otro. De un milenio para otro, como adelgaza un río en una sequía larga: el cauce sigue ahí, pero el agua baja cada vez con menos fuerza.","ent":false,"cap":false},{"t":"p","h":"Lo que la tierra canta de aquellos tiempos lo canta en voz baja:","ent":false,"cap":false},{"t":"cita","h":"\u003cp>\u003cem>Lamento de la deriva\u003c/em>\u003c/p>\n\u003cp>Bajo el brezo yacen\u003cspan class=\"cesura\"> \u003c/span>los del bronce y la trompa;\u003cbr>en el glaciar, los gigantes\u003cspan class=\"cesura\"> \u003c/span>con sus golpes guardados;\u003cbr>de piedra, los pequeños\u003cspan class=\"cesura\"> \u003c/span>que el alba prendió.\u003cbr>Va la tierra a la deriva,\u003cspan class=\"cesura\"> \u003c/span>sin dueño y sin día,\u003cbr>sin lobos que la sigan,\u003cspan class=\"cesura\"> \u003c/span>sin lunas que la lloren.\u003cbr>Nadie la nombra.\u003cspan class=\"cesura\"> \u003c/span>Nadie la nota.\u003c/p>\n","estrofa":true}]},{"id":"cap-7","tipo":"capitulo","numero":7,"etiqueta":"Capítulo VII","etiquetaLectura":"Capítulo 7","titulo":"Lo que se juró al filo del hacha","runas":"ᛚᛟ᛫ᚲᚢᛖ᛫ᛊᛖ᛫ᛃᚢᚱᛟ᛫ᚨᛚ᛫ᚠᛁᛚᛟ᛫ᛞᛖᛚ᛫ᚺᚨᚲᚺᚨ ᛭ ᛚᛟ᛫ᚲᚢᛖ᛫ᛊᛖ᛫ᛃᚢᚱᛟ᛫ᚨᛚ᛫ᚠᛁᛚᛟ᛫ᛞᛖᛚ᛫ᚺᚨᚲᚺᚨ ᛭ ᛚᛟ᛫ᚲᚢᛖ᛫ᛊᛖ᛫ᛃᚢᚱᛟ᛫ᚨᛚ᛫ᚠᛁᛚᛟ᛫ᛞᛖᛚ᛫ᚺᚨᚲᚺᚨ ᛭ ᛚᛟ᛫ᚲᚢᛖ᛫ᛊᛖ᛫ᛃᚢᚱᛟ᛫ᚨᛚ᛫ᚠᛁᛚᛟ᛫ᛞᛖᛚ᛫ᚺᚨᚲᚺᚨ","lam":{"t":"fig","id":"cap07-pacto-al-filo","src":"imagenes/cap07-pacto-al-filo.webp","w":1600,"h":900,"alt":"Odín, con parche en el ojo, levanta un hacha sobre una rama mientras una valquiria con manto de plumas vuela frente a él y le tiende la mano. Entre dos estandartes caen plumas blancas.","pie":"","formato":"apertura","marcador":false,"relleno":false},"bloques":[{"t":"p","h":"Te he contado el corte como lo contaría un cantar, si quedara alguno. Pero los cantares callan lo que no conviene, y yo te prometí la otra historia. Vuelve conmigo al vado, al amanecer del día del corte, antes de que Odín subiera por el puente.","ent":false,"cap":true},{"t":"p","h":"Sobre el campo de batalla volaban las valquirias, «las que eligen a los caídos».","ent":false,"cap":false},{"t":"p","h":"Son las doncellas de Odín. Cabalgan por el aire sobre los campos de Midgard cuando los hombres se matan, y de entre los muertos eligen a los mejores para llevarlos al Valhalla. Llevan mantos de plumas de cisne, y a veces, cuando se los quitan para bañarse en un lago, un hombre listo se los esconde y se casa con una de ellas, y le sale caro. Llevan lanza, casco y una mirada que pesa al muerto antes de que acabe de morir. Aquella mañana eran nueve, y llegaban tarde.","ent":false,"cap":false},{"t":"p","h":"La batalla del vado había dejado muchos muertos buenos. Había Gleymdir que murieron con la trompa en la boca, \u003cem>einherjar\u003c/em> que la corriente deshizo por segunda vez y gigantes que cayeron en el barro con la maza todavía en la mano. Las valquirias bajaron sobre ellos en un vuelo abierto, inclinadas, con los brazos extendidos, como bajan siempre a recoger lo que es suyo.","ent":false,"cap":false},{"t":"p","h":"Y no se posaron. No pudieron. Algo en el aire de Valgrund, aquella mañana, ya les cerraba el paso: la tierra estaba a punto de dejar de pertenecer al árbol, y ellas son del árbol. Pasaron a un palmo de los muertos sin tocarlos, una vez y otra vez, y de sus mantos se desprendieron plumas blancas que cayeron sobre el pecho de los cuerpos que no podrían llevarse.","ent":false,"cap":false},{"t":"fig","id":"cap07-plumas-sobre-el-campo","src":"imagenes/cap07-plumas-sobre-el-campo.webp","w":1600,"h":900,"alt":"Cinco valquirias con alas blancas sobrevuelan sin posarse un campo de batalla junto a un río, cubierto de muertos y escudos, mientras caen plumas blancas sobre los cuerpos.","pie":"","formato":"panoramica","marcador":false,"relleno":false},{"t":"p","h":"La que iba delante se llamaba Skuld. Su nombre quiere decir «lo que será», y es la más joven de las tres nornas, la que teje el porvenir. Es la única de las tejedoras que deja a veces el telar para cabalgar con las valquirias, y nadie sabe si es más norna que valquiria o al revés. En la lengua antigua, \u003cem>skuld\u003c/em> quiere decir también «la deuda», lo que se debe y lo que vence. A ella no le parece casualidad. Hizo una seña a sus hermanas, dieron la vuelta sobre el vado y subieron hacia el puente.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"Llegaron cuando Odín había dado ya el octavo golpe.","ent":false,"cap":false},{"t":"p","h":"Skuld se puso delante de él, en el aire, a la altura del hacha. No se posó en la rama ni en el puente, porque los dos eran ya casi de Valgrund. Las otras ocho se quedaron detrás, en un semicírculo de alas blancas contra el cielo.","ent":false,"cap":false},{"t":"p","h":"—Hay muertos en el vado —dijo Skuld—. Muertos tuyos y muertos buenos. Venimos a elegirlos.","ent":false,"cap":false},{"t":"p","h":"—No —dijo Odín.","ent":false,"cap":false},{"t":"p","h":"No dijo más, y no hacía falta. Skuld lo entendió antes de que él terminara la palabra, porque lo que será no tiene secretos para ella. Si las valquirias se llevaban a un solo muerto de Valgrund al Valhalla, ese muerto se sentaría a la mesa con la herida de la batalla del vado. Alguien le preguntaría dónde se la hizo, y él no sabría contestar, y la pregunta quedaría en el aire, y en el árbol lo que se pregunta también tira. El olvido tenía que ser total. Los muertos del vado se quedarían en el vado, sin Valhalla, sin Helheim, que es el reino de los muertos, y sin ningún sitio, y harían de guardia de la cárcel con sus huesos.","ent":false,"cap":false},{"t":"p","h":"—Nos pides que dejemos lo que es nuestro —dijo Skuld.","ent":false,"cap":false},{"t":"p","h":"—Os pido más —dijo Odín—. Os pido que no elijáis a nadie de aquí, nunca. Que no pongáis el pie en esta tierra, nunca. Que olvidéis el camino como lo voy a olvidar yo. Y que calléis.","ent":false,"cap":false},{"t":"p","h":"—¿Por qué no podemos poner el pie?","ent":false,"cap":false},{"t":"p","h":"—Porque lo que pisa una valquiria lo ve Odín —dijo él—. Vuestros ojos son los míos en los campos. Si una de vosotras pisa esta tierra, yo la veré. Y no puedo ver lo que tengo que olvidar.","ent":false,"cap":false},{"t":"p","h":"Skuld se quedó callada un rato. Dentro de la resina, pegada al tocón, yo oía cada palabra.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"—Lo haremos —dijo Skuld al fin—. Pero todo tiene un precio. Tú mejor que nadie lo sabes, que pagaste un ojo por un trago.","ent":false,"cap":false},{"t":"p","h":"Odín esperó. El hacha le pesaba en las manos.","ent":false,"cap":false},{"t":"p","h":"—Los nudos se aflojan —siguió ella—. Tú lo sabes y yo lo he visto. Con el olvido se aflojarán más despacio, pero las corrientes no estarán atadas para siempre: solo se irán quedando flacas. Llegará un día en que estén tan flacas que unos mortales puedan atarlas del todo. Ese día, alguien tendrá que venir a terminar lo que dejas a medias. Nosotras no podremos venir, porque nos lo prohíbes. Pero podremos mandar a los nuestros. Muertos elegidos por nosotras, que nunca pasarán por tu salón.","ent":false,"cap":false},{"t":"p","h":"—¿Y por qué querríais hacer eso?","ent":false,"cap":false},{"t":"p","h":"—Por el precio —dijo Skuld—. Cuando los Once estén atados y la tierra limpia, el décimo reino será nuestro. No tuyo, ni de los dioses, ni del árbol. Nuestro.","ent":false,"cap":false},{"t":"p","h":"Las ocho valquirias de detrás no se movieron. Una de ellas, la más alta, cerró los ojos.","ent":false,"cap":false},{"t":"p","h":"Odín pensó. Le vi pensar desde la resina, y es algo que da miedo ver. Pensó que una tierra cortada del árbol, sin hebra y sin camino, no valía nada para él. Pensó que las valquirias eran suyas y que lo que es de ellas es suyo. Y pensó, sobre todo, lo que hacía que todo lo demás diera igual: dentro de un momento iba a olvidarlo todo. Olvidaría la tierra, el trato y el precio. No se puede lamentar lo que se ha prometido si no se recuerda haberlo prometido.","ent":false,"cap":false},{"t":"p","h":"—Decidlo —dijo— para que valga.","ent":false,"cap":false},{"t":"p","h":"Skuld extendió la mano con la palma hacia abajo, a un palmo del filo del hacha, sin tocarlo. En la otra mano llevaba un huso de hilar sin hilo. Y dijo los términos, y las otras ocho los repitieron detrás, verso a verso, de modo que el pacto se dijo nueve veces a la vez:","ent":false,"cap":false},{"t":"cita","h":"\u003cp>\u003cem>El cantar de los términos\u003c/em>\u003c/p>\n\u003cp>Ni un muerto mudaremos\u003cspan class=\"cesura\"> \u003c/span>de este mundo cortado,\u003cbr>jamás posaremos\u003cspan class=\"cesura\"> \u003c/span>pie en su playa;\u003cbr>olvidaremos el camino,\u003cspan class=\"cesura\"> \u003c/span>callaremos el cuento\u003cbr>y aguardaremos el agua\u003cspan class=\"cesura\"> \u003c/span>hasta que adelgace.\u003cbr>Cuando la corriente\u003cspan class=\"cesura\"> \u003c/span>la quiebren los caídos,\u003cbr>mandaremos muertos\u003cspan class=\"cesura\"> \u003c/span>a amansar la marea,\u003cbr>y el reino sin rama\u003cspan class=\"cesura\"> \u003c/span>será refugio nuestro,\u003cbr>lejos del lobo,\u003cspan class=\"cesura\"> \u003c/span>libre del lazo.\u003c/p>\n","estrofa":true},{"t":"p","h":"—Lejos del lobo —repitió Odín, despacio—. Libre del lazo.","ent":false,"cap":false},{"t":"p","h":"Lo oyó. Lo entendió. El lobo es el que se lo comerá a él el último día, y el lazo es el tejido de las nornas. Un reino fuera del árbol queda fuera del tejido, y lo que está fuera del tejido no tiene que caer cuando caiga el árbol. Las valquirias no le estaban pidiendo una tierra. Le estaban pidiendo una salida.","ent":false,"cap":false},{"t":"p","h":"Asintió de todos modos. Ya te he dicho que iba a olvidarlo.","ent":false,"cap":false},{"t":"sep"},{"t":"p","h":"Odín dio el noveno golpe. Skuld retiró la mano en el último momento, y el filo pasó por donde había estado su palma.","ent":false,"cap":false},{"t":"p","h":"Desde arriba, desde el semicírculo de alas, el puente se partió como una rama seca, y la tierra empezó a irse. Las valquirias vieron alejarse los once anillos con sus ríos dormidos, sus muertos y s
